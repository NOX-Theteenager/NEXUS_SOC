<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Console opérateur — NEXUS SOC</title>
<meta name="theme-color" content="#0A0F1C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   NEXUS SOC — Console opérateur CENADI
   Public : admin_plateforme, analyste_soc. Poste de travail tenu 8 h d'affilée.
   La densité d'information prime sur l'aération. Français seul : les
   utilisateurs sont les analystes internes du CENADI.

   Sommaire des blocs CSS
     1. Tokens et base           5. Tableaux
     2. Ossature (barre, entête) 6. Alertes et détail
     3. Composants transverses   7. Enrôlement
     4. Cartes et KPI            8. Supervision et audit
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1. Tokens et base ──────────────────────────────────────────────────── */
:root {
  --bg:#0A0F1C; --bg-2:#0D1424; --surface:#0F1729; --surface-2:#131D33;
  --border:#1E293B; --border-2:#334155;
  --text:#E2E8F0; --text-2:#94A3B8; --text-3:#64748B; --text-4:#475569;
  --accent:#5EAAFF; --teal:#3DDC97; --amber:#F5A524; --red:#EF4444;
  --purple:#B98BFF;   /* console seulement : IA, modèles */
  --cyan:#38E1D6;     /* console seulement : réseau, flux */
  /* Tactiques MITRE — nouveaux tokens, réservés à la chaîne d'attaque */
  --tac-initial:#E879F9; --tac-exec:#EF4444; --tac-persist:#F5A524;
  --tac-evade:#F5A524;  --tac-discover:#FB923C; --tac-collect:#FB923C;
  --tac-c2:#5EAAFF;     --tac-exfil:#EF4444;  --tac-impact:#EF4444;
  --display:"Fraunces",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Courier New",monospace;
  --r-card:12px; --r-field:8px; --r-pill:999px;
  --sh-float:0 24px 80px rgba(0,0,0,.5);
  --focus:0 0 0 3px rgba(94,170,255,.15);
  --sidebar-w:220px; --header-h:58px;
}

/* ── Mode clair ───────────────────────────────────────────────────────────
   Seuls les tokens NEUTRES changent : fonds, bordures, niveaux de texte. Les
   couleurs porteuses de sens — rouge du risque, ambre de la dérive, teal du
   sain — gardent leur teinte, sinon un opérateur habitué à l'un des deux
   thèmes relirait mal l'autre.

   Les hues sont légèrement assombries en clair : le même #3DDC97 qui se lit
   bien sur fond nuit devient illisible sur blanc. */
:root[data-theme="light"] {
  --bg:#EEF2F7; --bg-2:#E9EFF6; --surface:#FFFFFF; --surface-2:#F4F8FC;
  --border:#DDE4EE; --border-2:#C4CEDC;
  --text:#0F1B2D; --text-2:#4A5A6E; --text-3:#5B6A7E; --text-4:#8A99AC;
  --accent:#1F6FD0; --teal:#0F9D6B; --amber:#B45309; --red:#C62828;
  --purple:#7C4DBE; --cyan:#0E8C86;
  --tac-initial:#A21CAF; --tac-exec:#C62828; --tac-persist:#B45309;
  --tac-evade:#B45309;   --tac-discover:#C2410C; --tac-collect:#C2410C;
  --tac-c2:#1F6FD0;      --tac-exfil:#C62828;    --tac-impact:#C62828;
  --sh-float:0 24px 60px rgba(15,27,45,.18);
  --focus:0 0 0 3px rgba(31,111,208,.22);
  color-scheme:light;
}
:root[data-theme="light"] .sk,
:root[data-theme="light"] .sk-hint { opacity:.9; }

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:var(--body); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button, input, select, textarea { font-family:inherit; color:inherit; }
:focus-visible { outline:none; box-shadow:var(--focus); border-radius:6px; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:3px; }
[hidden] { display:none !important; }
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0; }

/* Mouvement sobre : pulsation sur les points d'état en direct uniquement.
   Aucune animation d'entrée sur les lignes de tableau — un analyste
   rafraîchit sa file plusieurs fois par minute. */
@keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.3} }
@keyframes shimmer { to { background-position:-200% 0 } }
@keyframes cardIn  { from{opacity:0;transform:translateY(14px) scale(.99)} to{opacity:1;transform:none} }
@keyframes spin    { to { transform:rotate(360deg) } }

.kicker { font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); }
.mono   { font-family:var(--mono); }
.ic     { width:16px; height:16px; flex-shrink:0; }

/* ── 2. Ossature ────────────────────────────────────────────────────────── */
.app { display:flex; height:100vh; overflow:hidden; }

.side {
  width:var(--sidebar-w); flex-shrink:0;
  background:var(--bg-2); border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  transition:transform .25s cubic-bezier(.22,1,.36,1);
}
.side-brand {
  height:var(--header-h); padding:0 16px;
  display:flex; flex-direction:column; justify-content:center;
  border-bottom:1px solid var(--border);
}
.side-brand .logo { font-family:var(--display); font-style:italic; font-weight:600; font-size:17px; letter-spacing:-.02em; }
.side-brand .logo em { font-style:inherit; color:var(--amber); }
.side-brand .sub { font-family:var(--mono); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-3); }

.side-nav { flex:1; min-height:0; padding:12px 8px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
.nav-group { font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-4); padding:10px 10px 6px; }
.nav-group + .nav-group { padding-top:14px; }
.nav-item {
  width:100%; text-align:left;
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:8px; border:none; border-left:2px solid transparent;
  background:none; color:var(--text-2); font-size:12.5px; cursor:pointer;
  transition:background .2s, color .2s;
}
.nav-item:hover { background:var(--surface-2); }
.nav-item[aria-current="page"] { background:var(--surface-2); color:var(--text); border-left-color:var(--accent); }
.nav-item .ic { width:15px; height:15px; color:var(--text-4); }
.nav-item[aria-current="page"] .ic { color:var(--accent); }
.nav-item .label { flex:1; }
.nav-badge {
  font-family:var(--mono); font-size:9.5px; font-weight:700;
  color:#07111F; border-radius:var(--r-pill); padding:1px 7px;
}

.side-foot { padding:12px; border-top:1px solid var(--border); }
.user-card {
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 10px;
}
.avatar {
  width:30px; height:30px; border-radius:8px; flex-shrink:0;
  background:rgba(94,170,255,.12); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11px; font-weight:700;
}
.user-id { min-width:0; flex:1; }
.user-mail { font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-role { font-family:var(--mono); font-size:9px; color:var(--text-3); letter-spacing:.06em; }

.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.hdr {
  height:var(--header-h); padding:0 20px; flex-shrink:0;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--border); background:rgba(10,15,28,.9);
}
.hdr h1 { font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:-.02em; }
.hdr-spacer { flex:1; }
.live {
  display:flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:10px; color:var(--text-3);
}
.live .dot { width:7px; height:7px; border-radius:50%; background:var(--teal); animation:pulse 2.2s infinite; }
.live[data-offline="true"] .dot { background:var(--amber); animation:none; }

.burger { display:none; }

.banner-offline {
  padding:9px 20px; font-size:12px; color:var(--amber);
  background:rgba(245,165,36,.08); border-bottom:1px solid rgba(245,165,36,.25);
}

.view { flex:1; min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; }
/* min-height:0 est OBLIGATOIRE ici. Sans lui, un élément flexible garde pour
   minimum la hauteur de son contenu (min-height:auto) : le volet ne peut pas
   rétrécir, `overflow-y:auto` ne se déclenche jamais, et le parent .view
   (overflow:hidden) coupe purement et simplement les lignes du bas. C'est ce
   qui masquait la fin du parc d'agents, sans barre de défilement pour le
   signaler. */
.pane { flex:1; min-height:0; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:16px; }

/* ── 3. Composants transverses ──────────────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; gap:7px;
  background:none; border:1px solid var(--border-2); color:var(--text-2);
  border-radius:var(--r-field); padding:8px 15px;
  font-size:12.5px; cursor:pointer; transition:all .2s; white-space:nowrap;
}
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#07111F; font-weight:700; }
.btn-primary:hover { filter:brightness(1.08); color:#07111F; }
.btn-ok { background:var(--teal); border-color:var(--teal); color:#07111F; font-weight:700; }
.btn-ok:hover { filter:brightness(1.08); color:#07111F; }
.btn-warn:hover { border-color:var(--amber); color:var(--amber); }
.btn-danger:hover { border-color:var(--red); color:var(--red); }
.btn-sm { padding:3px 9px; font-size:11px; border-radius:6px; }

.input, .select {
  background:var(--bg-2); border:1px solid var(--border-2); border-radius:var(--r-field);
  color:var(--text); font-family:var(--mono); font-size:11.5px;
  padding:8px 11px; outline:none; transition:border-color .2s, box-shadow .2s;
}
.input::placeholder { color:var(--text-4); }
.input:focus, .select:focus { border-color:var(--accent); box-shadow:var(--focus); }
.select { color:var(--text-2); }
.toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.toolbar .input { flex:1; min-width:170px; }

/* Badge unique paramétré — remplace les quatre variantes qui coexistaient. */
.badge {
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid currentColor; border-radius:var(--r-pill); padding:2px 9px;
}
.badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:16px; }
.card-2 { background:var(--bg-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }

.sk { border-radius:var(--r-card); background:linear-gradient(90deg,#131D33 25%,rgba(30,41,59,.8) 50%,#131D33 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
.sk-hint { font-family:var(--mono); font-size:10.5px; color:var(--text-3); }

.empty { padding:44px 22px; text-align:center; }
.empty .mark {
  width:38px; height:38px; border-radius:50%; border:2px solid currentColor;
  display:flex; align-items:center; justify-content:center; font-size:19px; margin:0 auto 12px;
}
.empty.ok  .mark { color:var(--teal); }
.empty.err .mark { color:var(--red); }
.empty h3 { font-family:var(--display); font-size:18px; font-weight:600; letter-spacing:-.02em; color:var(--text); }
.empty p  { font-size:13px; color:var(--text-2); max-width:430px; margin:8px auto 0; line-height:1.6; }
.empty .code { font-family:var(--mono); font-size:10.5px; color:var(--text-3); margin-top:12px; }

.note { font-family:var(--mono); font-size:10.5px; color:var(--text-3); line-height:1.6; }

/* ── 4. Cartes et KPI ───────────────────────────────────────────────────── */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
.kpi {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
  padding:16px; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit;
  transition:border-color .12s, background .12s;
}
.kpi:hover { border-color:var(--border-2); background:var(--surface-2); }
.kpi:focus-visible { outline:none; box-shadow:var(--focus); border-color:var(--accent); }
.kpi-label { font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
.kpi-value { font-family:var(--display); font-size:30px; font-weight:600; letter-spacing:-.03em; line-height:1; }
.kpi-sub { font-size:11.5px; color:var(--text-3); margin-top:5px; }

.grid-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
.bar-row + .bar-row { margin-top:12px; }
.bar-head { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
.bar-track { height:7px; background:var(--bg-2); border-radius:4px; overflow:hidden; }
.bar-fill  { height:100%; border-radius:4px; }

.chips { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.chip {
  display:flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:10.5px;
  border:1px solid var(--border); border-radius:var(--r-pill); padding:3px 10px;
}
.chip .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

/* ── 5. Tableaux ────────────────────────────────────────────────────────── */
/* flex-shrink:0 est OBLIGATOIRE, et c'est subtil.

   `.tbl` porte overflow:hidden. Or la taille minimale automatique d'un élément
   flexible (min-height:auto) ne s'applique QUE si son overflow vaut `visible` :
   ici elle retombe à 0. Le tableau se laissait donc écraser par flex-shrink,
   coupant ses dernières lignes — pendant que la barre d'outils et la note,
   elles, restaient visibles. D'où l'impression d'une liste tronquée sans
   possibilité de défiler.

   Avec flex-shrink:0 le tableau garde sa hauteur naturelle, .pane déborde et
   défile réellement. `min-height:0` sur .pane ne suffisait pas : il rendait le
   défilement possible, mais rien ne débordait puisque l'enfant se compressait. */
.tbl {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-card); overflow:hidden; flex-shrink:0;
}
.tbl-scroll { overflow-x:auto; }
.tbl-head, .tbl-row { display:grid; align-items:center; min-width:760px; }
.tbl-head { background:var(--bg-2); border-bottom:1px solid var(--border); }
.tbl-head > * {
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3); padding:10px 12px; text-align:left;
  background:none; border:none;
}
.tbl-head button { cursor:pointer; display:flex; align-items:center; gap:5px; width:100%; }
.tbl-head button:hover { color:var(--accent); }
.tbl-head button[data-dir]::after { content:attr(data-dir); font-size:8px; }
.tbl-row { border-bottom:1px solid rgba(30,41,59,.6); }
.tbl-row:last-child { border-bottom:none; }
.tbl-row:hover { background:var(--surface-2); }
.tbl-row > * { padding:10px 12px; min-width:0; }
.cell-strong { font-size:13px; font-weight:600; }
.cell-mono { font-family:var(--mono); font-size:11.5px; color:var(--text-2); }
.cell-actions { display:flex; gap:6px; flex-wrap:wrap; }
.tbl-foot { display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--border); flex-wrap:wrap; }

/* ── 6. Alertes et détail ───────────────────────────────────────────────── */
.split { display:flex; flex:1; min-height:0; }
.queue { width:360px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
.queue-filters { padding:12px 14px; border-bottom:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap; }
.queue-filters .input { flex:1; min-width:110px; padding:7px 10px; }
.queue-filters .select { padding:7px 8px; font-size:11px; }
/* même règle que .pane : sans min-height:0, la file ne défile pas et les
   alertes du bas sont coupées sans indication. */
.queue-list { flex:1; min-height:0; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }

.q-item {
  width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border-2);
  border-radius:10px; padding:11px 12px; cursor:pointer; transition:background .2s, border-color .2s;
}
.q-item:hover { background:var(--surface-2); }
.q-item[aria-selected="true"] { background:var(--surface-2); border-color:var(--border-2); }
.q-top { display:flex; align-items:center; gap:10px; }
.q-risk { font-family:var(--mono); font-size:16px; font-weight:700; min-width:30px; }
.q-title { font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.q-meta  { font-family:var(--mono); font-size:10px; color:var(--text-3); margin-top:2px; }
.q-tags  { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
.q-tag   { font-family:var(--mono); font-size:9px; padding:2px 6px; border-radius:4px; border:1px solid currentColor; }

.detail { flex:1; min-width:0; min-height:0; overflow-y:auto; padding:20px 22px; }
.detail-head { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.detail-score { font-family:var(--display); font-size:44px; font-weight:600; letter-spacing:-.04em; line-height:1; }
.detail-score small { font-size:16px; opacity:.5; }
.detail-title { font-size:16px; font-weight:700; }
.detail-pills { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }

.chain-step { display:grid; grid-template-columns:22px 1fr; gap:12px; align-items:flex-start; }
.chain-rail { display:flex; flex-direction:column; align-items:center; align-self:stretch; }
.chain-dot  { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.chain-line { width:1px; flex:1; min-height:34px; }
.chain-body { padding-bottom:16px; }
.chain-tac  { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; border:1px solid currentColor; border-radius:4px; padding:2px 7px; }
.chain-tid  { font-family:var(--mono); font-size:11px; color:var(--text-2); }
.lien-perim {
  background:none; border:none; padding:0; font:inherit; color:var(--text);
  cursor:pointer; text-align:left; border-bottom:1px dotted var(--text-4);
}
.lien-perim:hover { color:var(--accent); border-bottom-color:var(--accent); }
.lien-perim:focus-visible { outline:none; box-shadow:var(--focus); border-radius:3px; }
.spark { display:inline-flex; align-items:flex-end; gap:1.5px; height:22px; width:78px; }
.spark i { flex:1; border-radius:1px; min-height:2px; }
.mitre-lien {
  background:none; border:none; padding:0; font:inherit; cursor:pointer;
  color:var(--text-2); text-decoration:none; border-bottom:1px dotted var(--text-4);
}
.mitre-lien:hover { color:var(--accent); border-bottom-color:var(--accent); }
.mitre-lien:focus-visible { outline:none; box-shadow:var(--focus); border-radius:3px; }
.chain-desc { font-size:13px; color:var(--text); margin-top:5px; line-height:1.55; }

.reason { display:flex; gap:9px; align-items:flex-start; font-size:13px; color:var(--text-2); line-height:1.55; }
.reason + .reason { margin-top:9px; }
.reason::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--purple); margin-top:8px; flex-shrink:0; }

/* Échelle de risque : positionne le score dans les bandes du système
   (< 40 faible, 40–59 moyen, 60–79 élevé, ≥ 80 critique) et face au seuil
   d'alerte configuré. Aucune pondération par raison n'est publiée par l'API :
   on ne l'invente pas. */
.scale { position:relative; height:10px; border-radius:5px; overflow:hidden; margin:16px 0 8px;
  background:linear-gradient(90deg,var(--teal) 0 40%,var(--accent) 40% 60%,var(--amber) 60% 80%,var(--red) 80% 100%); opacity:.55; }
.scale-cursor { position:absolute; top:-5px; width:3px; height:20px; background:var(--text); border-radius:2px; box-shadow:0 0 0 2px var(--surface); }
.scale-ticks { display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px; color:var(--text-3); }
.scale-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-family:var(--mono); font-size:10.5px; color:var(--text-3); }

.soar-action { background:var(--bg-2); border:1px solid var(--border); border-radius:10px; padding:14px; }
.soar-action + .soar-action { margin-top:10px; }
.soar-top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start; }
.soar-name { font-family:var(--mono); font-size:13px; color:var(--text); }
.soar-ctx  { font-size:12px; color:var(--text-2); margin-top:5px; line-height:1.55; }
.soar-btns { display:flex; gap:8px; margin-top:13px; flex-wrap:wrap; align-items:center; }

/* ── 7. Enrôlement ──────────────────────────────────────────────────────── */
.wizard { display:flex; gap:8px; flex-wrap:wrap; }
.wiz-step { flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
.wiz-step[data-state="done"]   { background:rgba(61,220,151,.06); border-color:rgba(61,220,151,.25); }
.wiz-step[data-state="active"] { border-color:var(--accent); }
.wiz-head { display:flex; align-items:center; gap:9px; }
.wiz-n {
  width:20px; height:20px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10.5px; font-weight:700;
  background:var(--border); color:var(--text-3);
}
.wiz-step[data-state="done"]   .wiz-n { background:var(--teal);   color:#07111F; }
.wiz-step[data-state="active"] .wiz-n { background:var(--accent); color:#07111F; }
.wiz-label { font-size:12.5px; font-weight:600; }
.wiz-value { font-family:var(--mono); font-size:10px; color:var(--text-3); margin-top:6px; word-break:break-all; }

.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:-1px; }
.tab {
  background:none; border:1px solid var(--border); border-bottom-color:var(--border-2);
  border-radius:10px 10px 0 0; padding:9px 16px;
  font-size:12.5px; font-weight:600; color:var(--text-3); cursor:pointer; transition:all .2s;
}
.tab[aria-selected="true"] { background:var(--surface); border-color:var(--border-2); border-bottom-color:var(--surface); color:var(--text); }
.tabpanel { background:var(--surface); border:1px solid var(--border-2); border-radius:0 var(--r-card) var(--r-card) var(--r-card); padding:20px; }

.codeblock { position:relative; background:var(--bg-2); border:1px solid var(--border-2); border-radius:10px; padding:14px 16px; }
.codeblock code { font-family:var(--mono); font-size:12px; color:var(--text-2); line-height:1.8; display:block; word-break:break-all; }
.copy-btn { position:absolute; top:10px; right:10px; background:var(--surface-2); }

.qr-box {
  width:172px; height:172px; flex-shrink:0;
  background:var(--bg-2); border:1px dashed var(--border-2); border-radius:12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:10px;
}
.qr-box img { width:100%; height:100%; object-fit:contain; background:#fff; border-radius:6px; padding:6px; }

.drop {
  border:1px dashed var(--border-2); border-radius:10px; padding:22px;
  text-align:center; color:var(--text-2); font-size:13px; cursor:pointer; transition:all .2s;
}
.drop:hover, .drop.over { border-color:var(--accent); color:var(--accent); background:rgba(94,170,255,.04); }

/* ── 8. Supervision et audit ────────────────────────────────────────────── */
.chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:16px; }
.chart-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.chart-title { font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px; }
.chart-title .dot { width:8px; height:8px; border-radius:50%; background:currentColor; animation:pulse 2.2s infinite; }
.chart-now { font-family:var(--mono); font-size:14px; }
.chart-axis { display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px; color:var(--text-3); margin-top:4px; }

.service-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
.service-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; }
.service-name { font-size:13px; font-weight:700; }
.service-metrics { display:flex; gap:12px; flex-wrap:wrap; margin-top:9px; padding-top:9px; border-top:1px solid var(--border); font-family:var(--mono); font-size:10.5px; color:var(--text-2); }

/* ── Modales — piège de focus + Échap ───────────────────────────────────── */
.overlay {
  position:fixed; inset:0; z-index:70;
  background:rgba(3,7,15,.72); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; padding:22px;
}
.modal {
  width:min(620px,100%); max-height:90vh; display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--border-2); border-radius:16px;
  box-shadow:var(--sh-float); animation:cardIn .3s cubic-bezier(.22,1,.36,1) both;
}
.modal-head { display:flex; align-items:flex-start; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border); }
.modal-head h2 { font-family:var(--display); font-size:19px; font-weight:600; letter-spacing:-.02em; flex:1; }
.modal-body { padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
.modal-foot { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
.icon-btn {
  width:32px; height:32px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:none; border:1px solid var(--border); border-radius:8px;
  color:var(--text-2); cursor:pointer; transition:all .2s;
}
.icon-btn:hover { border-color:var(--accent); color:var(--accent); }

.form-field { display:flex; flex-direction:column; gap:7px; }
.form-label { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); }
.form-hint  { font-family:var(--mono); font-size:10px; color:var(--text-3); }
.form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.checkbox { display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--text-2); cursor:pointer; }
.checkbox input { margin-top:3px; accent-color:var(--accent); }

/* ── Toasts ─────────────────────────────────────────────────────────────── */
.toasts { position:fixed; right:18px; bottom:18px; z-index:90; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.toast {
  max-width:400px; background:var(--surface-2); border:1px solid var(--border-2);
  border-left:3px solid var(--accent); border-radius:10px; padding:11px 14px;
  font-size:13px; box-shadow:0 12px 40px rgba(0,0,0,.5); animation:cardIn .25s ease both;
}
.toast.ok  { border-left-color:var(--teal); }
.toast.err { border-left-color:var(--red); }

/* ── Responsive : la console vise le poste fixe et dégrade proprement ───── */
@media (max-width:1024px) {
  .queue { width:300px; }
}
@media (max-width:768px) {
  .side {
    position:fixed; inset:0 auto 0 0; z-index:50;
    transform:translateX(-100%); box-shadow:var(--sh-float);
  }
  .side.open { transform:none; }
  .scrim { position:fixed; inset:0; z-index:45; background:rgba(3,7,15,.6); }
  .burger { display:flex; }
  .split { flex-direction:column; }
  .queue { width:auto; border-right:none; border-bottom:1px solid var(--border); max-height:44vh; }
  .pane { padding:16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

<script>
'use strict';

/* ═══ Garde de route ══════════════════════════════════════════════════════ */
if (!NexusAPI.guard(['admin_plateforme', 'analyste_soc'])) throw new Error('redirect');

const IS_ADMIN = NexusAPI.role === 'admin_plateforme';

/* ═══ Utilitaires ═════════════════════════════════════════════════════════ */
const $  = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* Palette en hexadécimal côté JS, en miroir des tokens CSS de :root.
   Les couleurs produites en JS servent aussi dans des attributs SVG et dans des
   compositions rgba() : var(--red) n'y est pas exploitable. Toute modification
   d'un token de :root doit être répercutée ici. */
/* Les couleurs utilisées par le JS sont LUES sur les tokens CSS plutôt que
   recopiées. Elles suivent donc le thème sans duplication — et la valeur
   résolue (un vrai hex) reste utilisable dans un attribut SVG, où `var()` ne
   passerait pas. Rechargées à chaque bascule de thème. */
function lireTokens() {
  const s = getComputedStyle(document.documentElement);
  const v = (n, secours) => (s.getPropertyValue('--' + n).trim() || secours);
  return {
    red:v('red', '#EF4444'), amber:v('amber', '#F5A524'),
    accent:v('accent', '#5EAAFF'), teal:v('teal', '#3DDC97'),
    purple:v('purple', '#B98BFF'), cyan:v('cyan', '#38E1D6'),
    text:v('text', '#E2E8F0'), text2:v('text-2', '#94A3B8'),
    muted:v('text-3', '#64748B'), border:v('border', '#1E293B'),
    tacInitial:v('tac-initial', '#E879F9'), tacWarm:v('tac-discover', '#FB923C'),
  };
}

/* ── Thème ────────────────────────────────────────────────────────────────
   Choix explicite mémorisé ; à défaut, préférence du système. La console est
   un poste de travail : un opérateur en salle éclairée doit pouvoir lire son
   écran sans forcer. */
const THEME_KEY = 'nexus_theme';
function themeInitial() {
  const m = localStorage.getItem(THEME_KEY);
  if (m === 'light' || m === 'dark') return m;
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

// Déclarées AVANT toute application de thème : `appliquerTheme` les recalcule,
// et une affectation avant déclaration lèverait une ReferenceError.
let C, CRIT, AGENT_STATE;

function appliquerTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem(THEME_KEY, t);
  C = lireTokens();
  // Ces tables figeaient les couleurs au chargement : sans recalcul, elles
  // gardaient les teintes du thème précédent après une bascule.
  CRIT = { critique:C.red, sensible:C.amber, standard:C.accent };
  AGENT_STATE = { actif:C.teal, isole:C.amber, hors_ligne:C.muted };
}
appliquerTheme(themeInitial());
const RISK = s => s >= 80 ? C.red : s >= 60 ? C.amber : s >= 40 ? C.accent : C.teal;

/* Fond translucide d'un badge, dérivé de sa couleur de texte. */
function tint(hex, a) {
  if (!hex || hex[0] !== '#') return 'transparent';
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a == null ? .1 : a})`;
}

/* CRIT et AGENT_STATE sont bâties par appliquerTheme() : elles doivent suivre
   la bascule clair/sombre, pas figer les couleurs du premier rendu. */

/* Délai de tolérance avant de déclarer un poste hors ligne. Valeur d'autorité
   côté serveur (AGENT_STALE_SECONDS) ; la valeur ci-dessous n'est qu'un repli
   d'affichage tant que le tableau de bord n'a pas répondu. */
let STALE_S = 120;
const AGENT_LABEL = { actif:'actif', isole:'isolé', hors_ligne:'hors ligne' };

const fmt = iso => iso ? new Date(iso).toLocaleString('fr-CM',
  { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
const fmtFull = iso => iso ? new Date(iso).toLocaleString('fr-CM',
  { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
const fmtHour = iso => iso ? new Date(iso).toLocaleTimeString('fr-CM', { hour:'2-digit', minute:'2-digit' }) : '—';

/* Ancienneté du dernier battement d'un agent. Sur un parc surveillé, « il y a
   14 s » et « il y a 3 jours » n'appellent pas la même réaction : l'écart brut
   informe mieux qu'un horodatage à décoder. */
function depuis(secondes) {
  if (secondes == null) return 'jamais vu';
  const s = Math.max(0, Math.round(secondes));
  if (s < 60)    return `il y a ${s} s`;
  if (s < 3600)  return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return `il y a ${Math.round(s / 86400)} j`;
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 4200);
}

async function copy(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast((label || 'Copié') + ' dans le presse-papiers.', 'ok');
  } catch {
    // Contexte non sécurisé (http://) : repli sur la sélection manuelle
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copié.', 'ok'); }
    catch { toast('Copie impossible — sélectionnez le texte manuellement.', 'err'); }
    ta.remove();
  }
}

/* ═══ Icônes — SVG en ligne, aucun CDN ════════════════════════════════════ */
const ICONS = {
  dashboard:  '<rect x="3" y="3" width="7.5" height="7.5" rx="1.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.2"/>',
  perimetre:  '<path d="M12 3l7 3v5.5c0 4.3-3 7.4-7 8.5-4-1.1-7-4.2-7-8.5V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
  agents:     '<rect x="3" y="4" width="18" height="7" rx="1.4"/><rect x="3" y="13" width="18" height="7" rx="1.4"/><path d="M6.5 7.5h.01M6.5 16.5h.01"/>',
  health:     '<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>',
  supervision:'<path d="M4 4v15.5a.5.5 0 00.5.5H21"/><path d="M7 14.5l3.5-4 3 2.8L20 7"/>',
  alerts:     '<path d="M12 3.5l8.5 15a1 1 0 01-.87 1.5H4.37a1 1 0 01-.87-1.5l8.5-15a1 1 0 011.74 0z"/><path d="M12 9.5v4"/><path d="M12 17h.01"/>',
  soar:       '<path d="M13 2.5L5.5 13H11l-1 8.5L18.5 11H13l1-8.5z"/>',
  enrol:      '<path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/>',
  close:      '<path d="M6 6l12 12M18 6L6 18"/>',
  info:       '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.info}</svg>`;

/* ═══ Référentiel MITRE ATT&CK ════════════════════════════════════════════
   Couvre les 8 règles de correlation_engine_v2.py plus les techniques
   voisines observées. `phase` ordonne la chaîne d'attaque reconstituée. */
const MITRE = {
  T1566:{ tac:'Initial Access',   phase:1, col:C.tacInitial,  lib:"Hameçonnage — pièce jointe ou lien reçu de l'extérieur" },
  T1078:{ tac:'Initial Access',   phase:1, col:C.tacInitial,  lib:'Utilisation de comptes valides existants' },
  T1059:{ tac:'Execution',        phase:2, col:C.red,     lib:'Exécution de commandes ou de scripts (shell, PowerShell)' },
  T1204:{ tac:'Execution',        phase:2, col:C.red,     lib:"Exécution déclenchée par l'utilisateur (fichier ouvert)" },
  T1053:{ tac:'Persistence',      phase:3, col:C.amber,  lib:'Tâche planifiée pour se maintenir sur le poste' },
  T1136:{ tac:'Persistence',      phase:3, col:C.amber,  lib:'Création de compte pour conserver un accès' },
  T1027:{ tac:'Defense Evasion',  phase:4, col:C.amber,    lib:'Fichier ou commande obfusqués pour échapper à la détection' },
  T1070:{ tac:'Defense Evasion',  phase:4, col:C.amber,    lib:'Effacement de traces sur le poste' },
  T1083:{ tac:'Discovery',        phase:5, col:C.tacWarm, lib:'Exploration des fichiers et répertoires' },
  T1087:{ tac:'Discovery',        phase:5, col:C.tacWarm, lib:'Énumération des comptes' },
  T1005:{ tac:'Collection',       phase:6, col:C.tacWarm,  lib:'Collecte de données sur le système local' },
  T1114:{ tac:'Collection',       phase:6, col:C.tacWarm,  lib:'Collecte de messagerie' },
  T1071:{ tac:'Command & Control',phase:7, col:C.accent,       lib:'Canal de commande sur un protocole applicatif (HTTP/S, DNS)' },
  T1571:{ tac:'Command & Control',phase:7, col:C.accent,       lib:'Port réseau non standard' },
  T1090:{ tac:'Command & Control',phase:7, col:C.accent,       lib:'Relais ou proxy pour masquer la destination' },
  T1041:{ tac:'Exfiltration',     phase:8, col:C.red,    lib:'Exfiltration par le canal de commande existant' },
  T1048:{ tac:'Exfiltration',     phase:8, col:C.red,    lib:'Exfiltration par un protocole alternatif' },
  T1486:{ tac:'Impact',           phase:9, col:C.red,   lib:'Chiffrement de données à des fins de blocage (rançongiciel)' },
};
/* La colonne `mitre` n'est pas normalisée : le moteur de corrélation y écrit
   « T1071 · C2 », parfois « T1059.001 », parfois plusieurs entrées séparées par
   des virgules. On extrait l'identifiant par motif, et on conserve le libellé de
   tactique porté par la donnée quand il y en a un — c'est le moteur qui a
   qualifié l'événement, le référentiel embarqué n'est qu'un complément
   d'affichage (couleur et description). */
const TID_RE = /T\d{4}(?:\.\d{3})?/;

/* Nom officiel ATT&CK et règle de détection réellement appliquée.

   Ces données ne sont pas recopiées de mémoire : elles proviennent de
   Lot2_Pipeline_SIEM/correlation_engine_v2.py, c'est-à-dire du code qui lève
   effectivement la détection. La fiche décrit donc ce que NEXUS cherche, pas
   une généralité — ce qui est plus utile à l'analyste que la page publique. */
const MITRE_REGLE = {
  T1204: ['User Execution: Malicious File',
          'Fichier apparu dans un répertoire de téléchargement avec une extension exécutable (.exe, .scr, .js, .bat, .vbs).'],
  T1059: ['Command and Scripting Interpreter',
          'Processus figurant dans la liste des interpréteurs surveillés (cmd, powershell, wscript, cscript, nc, ncat, mshta, rundll32), ou binaire exécuté depuis un répertoire temporaire.'],
  T1027: ['Obfuscated Files or Information',
          'Exécutable lancé depuis /tmp, argument contenant une chaîne base64 de 40 caractères ou plus, double extension (.ps1.exe), ou motif PowerShell d’obfuscation (iex, invoke-expression, frombase64).'],
  T1136: ['Create Account',
          'Commande de création de compte (useradd, adduser, net user /add, dsadd). Une création massive sur une courte fenêtre lève la même technique en règle volumétrique.'],
  T1005: ['Data from Local System',
          'Accès à un chemin sensible : /etc/shadow, /etc/passwd, /etc/sudoers, ou chemin contenant finance, budget, contribuable, sigipes, sydonia.'],
  T1083: ['File and Directory Discovery',

          'Connexion TCP ÉTABLIE vers un port de commande connu (4444, 6667, 1337, 9001, 31337, 5555) ou vers une adresse figurant en renseignement sur la menace.'],
  T1486: ['Data Encrypted for Impact',
          'Modification massive de fichiers sur une fenêtre courte, seuil configurable (MASS_FILE_THRESHOLD).'],

/* Fiche ATT&CK, affichée LOCALEMENT.

   Le lien vers attack.mitre.org restait blanc sur ce déploiement : le site est
   hébergé sur GitHub Pages, dont les adresses ne répondent pas depuis ce
   réseau, et son nom ne résout qu'en IPv6 alors qu'aucune route IPv6 n'existe.
   Une plateforme conçue pour fonctionner coupée d'Internet ne peut pas confier
   une information de travail à une ressource distante : la fiche est donc
   servie depuis la table locale, et le lien externe n'est qu'un complément
   annoncé comme tel. */
function mitreLien(tid, libelle) {
  const id = String(tid || '').match(TID_RE);
  if (!id) return `<span class="chain-tid">${esc(libelle)}</span>`;
  return `<button class="chain-tid mitre-lien" data-mitre="${esc(id[0])}"
            title="Fiche ${esc(id[0])} — consultable hors ligne">${esc(libelle)}</button>`;
}

function ficheMitre(tid) {
  const base = tid.split('.')[0];
  const m = MITRE[base] || {};
  const [nomOfficiel, regle] = MITRE_REGLE[base] || [null, null];
  const url = 'https://attack.mitre.org/techniques/' + tid.replace('.', '/') + '/';

  openModal(`${esc(tid)}${nomOfficiel ? ' · ' + esc(nomOfficiel) : ''}`, `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      ${m.tac ? badge(m.tac, m.col || C.muted) : ''}
      ${m.phase ? `<span class="note">phase ${esc(m.phase)} de la chaîne</span>` : ''}
    </div>

    ${m.lib ? `<div class="kicker" style="margin-bottom:8px">Ce que fait l'attaquant</div>
      <p style="font-size:13.5px;color:var(--text-2);line-height:1.7;margin-bottom:18px">${esc(m.lib)}</p>` : ''}

    ${regle ? `<div class="kicker" style="margin-bottom:8px">Ce que NEXUS observe pour la détecter</div>
      <p style="font-size:13.5px;color:var(--text-2);line-height:1.7;margin-bottom:8px">${esc(regle)}</p>
      <p class="note">Règle appliquée par Lot2_Pipeline_SIEM/correlation_engine_v2.py.</p>`
      : `<p class="note">Aucune règle de détection propre à cette technique dans le moteur :
         elle provient de l'étiquetage d'une alerte de scoring, pas d'une corrélation d'événements.</p>`}

    <p class="note" style="margin-top:18px;padding-top:12px;border-top:1px solid var(--border);line-height:1.7">
      Fiche complète sur le site officiel :
      <a href="${url}" target="_blank" rel="noopener noreferrer">${esc(url)}</a><br>
      Ressource externe — inaccessible sur un déploiement coupé d'Internet, et actuellement
      injoignable depuis ce réseau.
    </p>`,
    `<button class="btn" data-close>Fermer</button>`);
}

function mitreOf(raw) {
  const s = String(raw).trim();
  const m = s.match(TID_RE);
  const tid = m ? m[0] : s;
  const ref = MITRE[tid.split('.')[0]];
  // Libellé accolé à l'identifiant dans la donnée : « T1071 · C2 » → « C2 »
  const inline = s.replace(TID_RE, '').replace(/^[\s·:,–—-]+/, '').trim();
  return {
    tid,
    tac:   inline || (ref ? ref.tac : 'Technique'),
    phase: ref ? ref.phase : 50,
    col:   ref ? ref.col : C.text2,
    lib:   ref ? ref.lib : 'Technique non répertoriée dans le référentiel embarqué.',
  };
}

/* Extraction des identifiants ATT&CK.
   Deux formats coexistent en base : « T1005, T1059, T1071 » (corrélation) et
   « T1071 · C2 » (scoring, identifiant suivi de sa tactique). Découper sur la
   virgule ne résout que le premier — les alertes au second format tombaient
   toutes en « technique non répertoriée ». On extrait donc les identifiants
   par motif, ce qui couvre les deux et gère les sous-techniques (T1566.001). */
function mitreList(m) {
  if (!m) return [];
  const src = Array.isArray(m) ? m.join(',') : String(m);
  const ids = src.match(/T\d{4}(?:\.\d{3})?/g);
  return ids ? [...new Set(ids)] : [];
}
/* Les raisons peuvent arriver sous deux formes :
   — historique : liste de chaînes déjà rédigées ;
   — depuis la refonte : liste d'objets {label, sigma, valeur, texte}, où sigma
     est l'écart à la normale que les modèles calculaient déjà mais jetaient.
   On normalise vers la seconde forme, sans perdre les alertes déjà en base. */
function reasonList(r) {
  let raw = r;
  if (!raw) return [];
  if (typeof raw === 'string') {
    try { raw = JSON.parse(raw); } catch { return [{ texte: raw, sigma: null }]; }
  }
  if (!Array.isArray(raw)) return [{ texte: String(raw), sigma: null }];
  return raw.map(x => (x && typeof x === 'object')
    ? { label: x.label || x.texte || '', sigma: (x.sigma == null ? null : Number(x.sigma)),
        valeur: x.valeur, texte: x.texte || x.label || '' }
    : { label: String(x), sigma: null, texte: String(x) });
}

/* Étapes de la chaîne d'attaque, produites par le moteur de corrélation. */
function chainList(c) {
  let raw = c;
  if (!raw) return [];
  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch { return []; } }
  return Array.isArray(raw) ? raw.filter(x => x && typeof x === 'object') : [];
}

function partsList(p) {
  let raw = p;
  if (!raw) return [];
  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch { return []; } }
  return Array.isArray(raw)
    ? raw.filter(x => x && typeof x === 'object' && x.valeur != null)
         .map(x => ({ label: String(x.label || '—'), valeur: Number(x.valeur) }))
    : [];
}

/* ═══ État ════════════════════════════════════════════════════════════════ */
const S = {

  offline:  !navigator.onLine,
  dashboard:null, tenants:null, agents:null, health:null,
  alerts:null, pending:null, audit:null, metrics:null, drift:null,

              perimQ:'', perimCrit:'', agentQ:'', agentStatut:'', agentOs:'',

};

if (!SECTIONS.some(s => s.key === S.section && (!s.admin || IS_ADMIN))) S.section = 'dashboard';

/* ═══ Navigation ══════════════════════════════════════════════════════════ */
function renderNav() {
  const groups = [...new Set(SECTIONS.map(s => s.group))];
  $('nav').innerHTML = groups.map(g => {
    const items = SECTIONS.filter(s => s.group === g && (!s.admin || IS_ADMIN));
    if (!items.length) return '';
    return `<div class="nav-group">${esc(g)}</div>` + items.map(s => {
      let badge = '';
      if (s.badge === 'alerts' && S.alerts) {
        const n = S.alerts.filter(a => a.statut === 'ouverte').length;
        if (n) badge = `<span class="nav-badge" style="background:var(--red)">${n}</span>`;
      }
      if (s.badge === 'soar' && S.pending && S.pending.length) {
        badge = `<span class="nav-badge" style="background:var(--amber)">${S.pending.length}</span>`;
      }
      return `<button class="nav-item" data-go="${s.key}"${S.section === s.key ? ' aria-current="page"' : ''}>
        ${ic(s.icon)}<span class="label">${esc(s.label)}</span>${badge}</button>`;
    }).join('');
  }).join('');

  $('nav').querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => goto(b.dataset.go)));
}

function goto(key) {
  const s = SECTIONS.find(x => x.key === key);
  if (!s || (s.admin && !IS_ADMIN)) return;
  S.section = key;
  history.replaceState(null, '', '#' + key);
  $('view-title').textContent = TITLES[key];
  document.getElementById('side').classList.remove('open');
  document.querySelector('.scrim')?.remove();
  renderNav();
  renderView();
  loadSection();
}

/* ═══ Chargement par section ══════════════════════════════════════════════ */
async function pull(key, fn) {
  S.loading[key] = true;
  try {
    const d = await fn();
    /* Session expirée : api.js purge les jetons et renvoie `null` sans rediriger.
       Sans ce test, la section restait en squelette perpétuel — ni donnée, ni
       erreur, donc aucune explication à l'écran. */
    if (d === null) {
      S.errors[key] = { status: 401, detail: 'Session expirée — reconnectez-vous.' };
      S[key] = null;
      return;
    }
    S[key] = d; S.errors[key] = null;
    if (!navigator.onLine) S.offline = true;
  } catch (e) {
    S.errors[key] = e;
    if (e && e._network) S.offline = true;
  } finally {
    S.loading[key] = false;
  }
}

async function loadSection() {
  const sec = S.section;
  const jobs = [];
  if (sec === 'dashboard')  jobs.push(pull('dashboard', () => NexusAPI.getSOCDashboard()
                                        .then(d => { if (d && d.stale_after_s) STALE_S = d.stale_after_s; return d; })),
                                      pull('alerts',    () => NexusAPI.getAlerts({ limit:20 })),
                                      pull('health',    () => NexusAPI.getHealth()));
  // La vue détail d'un périmètre agrège parc, alertes et file SOAR : sans ces
  // trois chargements, elle afficherait des zéros au lieu de la réalité.
  if (sec === 'perimetres') jobs.push(pull('tenants', () => NexusAPI.getTenants()),
                                      pull('agents',  () => NexusAPI.getAgents()),
                                      pull('alerts',  () => NexusAPI.getAlerts({ limit:100 })),
                                      pull('pending', () => NexusAPI.getPendingSOAR()));
  if (sec === 'agents')     jobs.push(pull('agents',  () => NexusAPI.getAgents()),
                                      pull('tenants', () => NexusAPI.getTenants()));
  if (sec === 'sante')      jobs.push(pull('health',  () => NexusAPI.getHealth()));
  if (sec === 'supervision')jobs.push(pull('metrics', () => NexusAPI.getMetrics(S.filters.metricsHours)),
                                      pull('drift',   () => NexusAPI.getModelDrift(S.filters.driftDays)),
                                      pull('audit',   () => NexusAPI.getSoarAudit({
                                        impact:S.filters.auditImpact, limit:100 })));
  if (sec === 'alertes')    jobs.push(pull('alerts',  () => NexusAPI.getAlerts({ limit:100 })),
                                      pull('pending', () => NexusAPI.getPendingSOAR()));
  if (sec === 'soar')       jobs.push(pull('pending', () => NexusAPI.getPendingSOAR()),
                                      pull('audit',   () => NexusAPI.getSoarAudit({ limit:50 })));
  // `agents` alimente le suivi en direct de l'enrôlement en cours.
  if (sec === 'enrolement') jobs.push(pull('tenants', () => NexusAPI.getTenants()),
                                      pull('agents',  () => NexusAPI.getAgents()));

  renderView();
  await Promise.all(jobs);
  renderNav();
  renderView();
}

/* ═══ Fragments réutilisables ═════════════════════════════════════════════ */
const skeleton = (n, h) => `<div style="display:flex;flex-direction:column;gap:12px">`
  + Array.from({ length:n }, () => `<div class="sk" style="height:${h || 76}px"></div>`).join('')
  + `<p class="sk-hint">Squelettes rendus avant la réponse de l'API — premier rendu utile immédiat.</p></div>`;

const errorPane = (endpoint, err) => `
  <div class="empty err">
    <div class="mark">!</div>
    <h3>Section indisponible</h3>
    <p>L'API n'a pas répondu. Les agents continuent d'émettre : la télémétrie est mise en file dans Kafka et sera rattrapée.</p>
    <div class="code">${esc(endpoint)} → ${esc((err && err.status) || 0)} · ${esc((err && err.detail) || 'erreur réseau')}</div>
    <button class="btn" style="margin-top:16px" data-retry>Réessayer</button>
  </div>`;

const badge = (label, color) =>
  `<span class="badge" style="color:${color};background:${tint(color)}">${esc(label)}</span>`;

/* ═══ Rendu ═══════════════════════════════════════════════════════════════ */
function renderView() {
  $('banner-offline').hidden = !S.offline;
  $('live').dataset.offline = String(S.offline);
  $('live-label').textContent = S.offline ? 'hors ligne · données du cache' : 'scrutation 30 s';

  const v = $('view');
  const R = {
    dashboard:renderDashboard, perimetres:renderPerimetres, agents:renderAgents,
    sante:renderSante, supervision:renderSupervision, alertes:renderAlertes,
    soar:renderSoar, enrolement:renderEnrolement,
  }[S.section];
  v.innerHTML = R ? R() : '';
  v.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', loadSection));
  (WIRE[S.section] || (() => {}))();
}

/* ── Tableau de bord ────────────────────────────────────────────────────── */
function renderDashboard() {
  if (S.loading.dashboard && !S.dashboard) return `<div class="pane">${skeleton(3, 96)}</div>`;
  if (S.errors.dashboard && !S.dashboard) return `<div class="pane">${errorPane('GET /analyst/dashboard', S.errors.dashboard)}</div>`;

  const d = S.dashboard || {};
  const alerts = (S.alerts || []).filter(a => a.statut === 'ouverte');
  const healthy = (d.open_alerts || 0) === 0;

  /* Chaque KPI mène à la vue qui l'explique, en y posant le filtre correspondant.
     Un chiffre sur lequel on ne peut pas cliquer oblige l'analyste à refaire le
     tri à la main pour retrouver ce qu'il vient de lire. */
  const kpis = [
    ['Alertes ouvertes', d.open_alerts ?? '—',
     healthy ? 'aucun incident en cours' : 'toutes périmètres confondus',
     healthy ? C.teal : C.red, { sec:'alertes', statut:'ouverte' }],
    ['Alertes critiques', d.critical_alerts ?? '—', 'seuil risque ≥ 80',
     (d.critical_alerts || 0) ? C.red : C.teal, { sec:'alertes', statut:'ouverte', risk:'80-100' }],
    ['Agents en ligne', d.agents_online ?? '—',
     `sur ${d.tenants_total || 0} périmètre${(d.tenants_total || 0) > 1 ? 's' : ''}`,
     C.text, { sec:'agents', agentStatut:'actif' }],
    ['Périmètres supervisés', d.tenants_total ?? '—', 'cloisonnés par RLS',
     C.text, { sec:'perimetres' }],
  ];

  const top = (d.top_tenants_by_incidents || []);
  const maxInc = Math.max(1, ...top.map(t => Number(t.incidents) || 0));

  const services = (S.health && S.health.services) || {};
  const chips = Object.entries(services).map(([name, sv]) => {
    const ok = sv.status === 'ok';
    const col = ok ? C.teal : sv.status === 'error' ? C.red : C.amber;
    return `<span class="chip" style="color:${col}"><span class="dot"></span>${esc(serviceLabel(name))}</span>`;
  }).join('');

  return `<div class="pane">
    <div class="kpi-grid">
      ${kpis.map(([l, v, s, c, cible]) => `<button class="kpi" type="button"
          data-kpi="${esc(encodeURIComponent(JSON.stringify(cible)))}"
          aria-label="${esc(l)} : ${esc(v)}. Ouvrir la vue détaillée.">
        <div class="kpi-label">${esc(l)}</div>
        <div class="kpi-value" style="color:${c}">${esc(v)}</div>
        <div class="kpi-sub">${esc(s)}</div></button>`).join('')}
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="kicker" style="margin-bottom:14px">Périmètres les plus touchés</div>
        ${top.length ? top.map(t => {
          const n = Number(t.incidents) || 0;
          const col = n >= 6 ? C.red : n >= 2 ? C.amber : n > 0 ? C.accent : C.teal;
          return `<div class="bar-row">
            <div class="bar-head"><span>${esc(t.nom)}</span><span class="mono" style="color:${col}">${n}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n / maxInc * 100)}%;background:${col}"></div></div>
          </div>`;
        }).join('') : `<p class="note">Aucun périmètre enregistré.</p>`}
        <div class="note" style="margin-top:14px;padding-top:11px;border-top:1px solid var(--border)">top_tenants_by_incidents · /analyst/dashboard</div>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">
          <div class="kicker">Dernières alertes</div>
          <button class="btn btn-sm" data-go-alertes>ouvrir la file</button>
        </div>
        ${alerts.length ? `<div style="display:flex;flex-direction:column;gap:8px">${
          alerts.slice(0, 4).map(a => {
            const c = RISK(Number(a.risque));
            return `<div class="card-2" style="border-left:2px solid ${c};display:flex;align-items:center;gap:11px">
              <span class="mono" style="font-size:15px;font-weight:700;color:${c};min-width:28px">${esc(a.risque)}</span>
              <div style="min-width:0;flex:1">
                <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.type)} — ${esc(a.entite)}</div>
                <div class="note">${esc(a.tenant_nom || '—')} · ${esc(a.source_modele || '—')} · ${esc(fmtHour(a.cree_le))}</div>

/* ── Parc d'agents ──────────────────────────────────────────────────────── */
const AGENT_COLS = '30px 1.2fr 1fr .7fr .85fr .9fr .8fr 1.1fr';

/* Silhouette d'activité sur 24 h, 12 créneaux de 2 h.

   C'est un COMPTE de mesures reçues, pas une valeur métier : un creux signale
   un agent qui s'est tu. Les barres à zéro restent visibles en teinte de bord
   — une colonne absente se confondrait avec la fin du graphe. */
/* Version d'un agent, comparée à la plus récente du parc.
   `version_agent` reste NULL tant que l'agent n'a pas émis avec un collecteur
   assez récent pour la transmettre. On le dit — « inconnue » n'est pas « à
   jour », et laisser la case vide ferait croire à une absence de problème. */
function versionAgent(a) {
  const v = a.version_agent;
  if (!v) return `<span class="note" title="Ce collecteur ne transmet pas encore sa version. Mettez-le à jour pour la voir apparaître.">inconnue</span>`;
  const ref = window._versionRef;
  if (ref && v !== ref) {
    return `<span style="color:var(--amber)" title="Version ${esc(v)} — la plus récente du parc est ${esc(ref)}">${esc(v)} ⚠</span>`;
  }
  return `<span style="color:var(--text-2)">${esc(v)}</span>`;
}

function sparkAgent(serie, couleur) {
  const s = Array.isArray(serie) ? serie : [];
  if (!s.length) return '<span class="note">—</span>';
  const max = Math.max(1, ...s);
  const total = s.reduce((a, b) => a + b, 0);
  const creux = s.filter(v => v === 0).length;
  const titre = total
    ? `${total} mesures sur 24 h · ${creux} créneau(x) de 2 h sans donnée`
    : 'aucune mesure sur 24 h';
  return `<span class="spark" title="${esc(titre)}" role="img" aria-label="${esc(titre)}">${
    s.map(v => `<i style="height:${v ? Math.max(12, Math.round(v / max * 100)) : 6}%;
                          background:${v ? couleur : 'var(--border-2)'}"></i>`).join('')}</span>`;
}

/* ── Supervision : graphiques SVG, dérive IA, journal SOAR ──────────────── */
/* Libellés et couleurs des séries de l'hypertable `metrics`.
   Les clés viennent de ce que le service de scoring écrit réellement en base ;
   toute métrique non listée reste affichée, avec un libellé dérivé de sa clé et
   la couleur d'accent — mieux vaut une série anonyme qu'une série masquée. */
const METRIC_META = {
  'risque_network':  ['Score de risque · réseau (M1)', C.red,    '0–100'],
  'risque_user-day': ['Score de risque · UEBA (M2)',   C.purple, '0–100'],
  'evenements_recus':['Événements reçus',              C.cyan,   'événements'],
  'alertes_emises':  ['Alertes émises',                C.amber,  'alertes'],
  'cpu':             ['Charge CPU des agents',         C.accent, '%'],
  'score_risque':    ['Score de risque agrégé',        C.red,    '0–100'],
  'octets_sortants': ['Octets sortants',               C.cyan,   'octets'],
};
const metricMeta = k => METRIC_META[k]
  || [k.replace(/[_-]+/g, ' ').replace(/^./, c => c.toUpperCase()), C.accent, ''];

/* Tracé d'une série mesurée.

   L'abscisse était l'INDEX du point, pas son horodatage : une coupure de
   collecte de cinq heures se dessinait exactement comme un pas d'une minute, et
   la ligne la traversait sans rupture. Sur 24 h réellement mesurées 423 minutes
   sur 1440, l'écran montrait une série continue.

   L'axe est désormais temporel, les interruptions rompent le tracé et sont
   grisées. Une absence de mesure ne doit pas se lire comme une mesure stable. */
function svgChart(points, color, w, h) {
  if (!points.length) return '';
  const pts = points.map(p => ({ t: new Date(p.t).getTime(), v: Number(p.v) }))
                    .filter(p => isFinite(p.t) && isFinite(p.v))
                    .sort((a, b) => a.t - b.t);
  if (!pts.length) return '';

  const vals = pts.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1, pad = span * .12;
  const lo = min - pad, hi = max + pad;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const dt = (t1 - t0) || 1;
  const X = p => ((p.t - t0) / dt) * w;
  const Y = p => h - (p.v - lo) * (h / (hi - lo));

  /* Seuil de rupture : trois fois le pas médian, au minimum trois minutes
     (les séries sont agrégées à la minute par /admin/metrics). Un seuil
     relatif évite de découper une série volontairement peu dense. */
  const steps = pts.slice(1).map((p, i) => p.t - pts[i].t).sort((a, b) => a - b);
  const median = steps.length ? steps[Math.floor(steps.length / 2)] : 60000;
  const seuil = Math.max(3 * 60000, 3 * median);

  const segments = [];
  let seg = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].t - pts[i - 1].t > seuil) { segments.push(seg); seg = []; }
    seg.push(pts[i]);
  }
  segments.push(seg);

  const trous = [];
  for (let i = 1; i < segments.length; i++) {
    const x1 = X(segments[i - 1][segments[i - 1].length - 1]), x2 = X(segments[i][0]);
    trous.push(`<rect x="${x1.toFixed(1)}" y="0" width="${Math.max(1, x2 - x1).toFixed(1)}" height="${h}"
                      fill="var(--border)" opacity=".45"/>`);
  }

  const traces = segments.filter(s => s.length).map(s => {
    const d = s.map(p => `${X(p).toFixed(1)},${Y(p).toFixed(1)}`).join(' ');
    if (s.length === 1) {
      return `<circle cx="${X(s[0]).toFixed(1)}" cy="${Y(s[0]).toFixed(1)}" r="1.8" fill="${color}"/>`;
    }
    const x0 = X(s[0]).toFixed(1), xn = X(s[s.length - 1]).toFixed(1);
    return `<polyline points="${x0},${h} ${d} ${xn},${h}" fill="${color}" opacity=".09" stroke="none"/>
            <polyline points="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  }).join('');

  const couverture = trous.length
    ? ` — ${trous.length} interruption${trous.length > 1 ? 's' : ''} de collecte`
    : '';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img"
               aria-label="Série de ${pts.length} points mesurés, de ${min.toFixed(1)} à ${max.toFixed(1)}${couverture}">
    ${/* grille : token, pas hex figé — invisible sur fond clair sinon */''}
    ${[.25, .5, .75].map(f => `<line x1="0" y1="${(h * f).toFixed(0)}" x2="${w}" y2="${(h * f).toFixed(0)}" stroke="${C.border}" stroke-width="1"/>`).join('')}
    ${trous.join('')}
    ${traces}
  </svg>`;
}

/* Nombre d'interruptions d'une série, pour l'annoncer sous le graphique.
   Même seuil que le tracé — les deux doivent raconter la même chose. */
function comptesTrous(points) {
  const ts = (points || []).map(p => new Date(p.t).getTime()).filter(isFinite).sort((a, b) => a - b);
  if (ts.length < 2) return 0;
  const steps = ts.slice(1).map((t, i) => t - ts[i]).sort((a, b) => a - b);
  const seuil = Math.max(3 * 60000, 3 * steps[Math.floor(steps.length / 2)]);
  return ts.slice(1).filter((t, i) => t - ts[i] > seuil).length;
}

function renderSupervision() {
  if (S.loading.metrics && !S.metrics) return `<div class="pane">${skeleton(3, 170)}</div>`;
  if (!S.metrics && S.errors.metrics)
    return `<div class="pane">${errorPane('GET /admin/metrics?hours=' + S.filters.metricsHours, S.errors.metrics)}</div>`;

  const m = S.metrics || { series:{}, resume:{}, metriques:[] };
  const ranges = [[1,'1 h'],[6,'6 h'],[24,'24 h'],[168,'7 j']];

  const charts = (m.metriques || []).map(k => {
    const [title, color, unit] = metricMeta(k);
    const pts = m.series[k] || [];
    const cur = m.resume[k];
    return `<div class="chart-card">
      <div class="chart-head">
        <div class="chart-title" style="color:${color}"><span class="dot"></span><span style="color:var(--text)">${esc(title)}</span></div>
        <div class="chart-now" style="color:${color}">${cur ? esc(cur.dernier) : '—'}</div>

      <div class="chart-axis"><span>${esc(pts.length ? fmt(pts[0].t) : '—')}</span>
        <span>${esc(unit)}</span><span>maintenant</span></div>
      ${(() => { const n = comptesTrous(pts); return n
        ? `<p class="note" style="margin-top:6px">${n} interruption${n > 1 ? 's' : ''} de collecte sur la fenêtre —
             zones grisées. La courbe ne les franchit pas : rien n'y a été mesuré.</p>`
        : ''; })()}
    </div>`;
  }).join('');

  return `<div class="pane">
    <div class="toolbar">
      ${ranges.map(([h, l]) => `<button class="btn btn-sm" data-range="${h}"
        style="${S.filters.metricsHours === h ? 'border-color:var(--accent);color:var(--accent);background:rgba(94,170,255,.12)' : ''}">${l}</button>`).join('')}
