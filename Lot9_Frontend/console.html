    </div>

    <div class="grid-2">
      ${charts || `<div class="card"><p class="note">Aucune métrique enregistrée sur la fenêtre choisie. Les séries sont alimentées par la table <b>metrics</b> (cpu, score_risque, octets_sortants).</p></div>`}
      ${renderDrift()}
    </div>

    ${renderAuditTable()}
  </div>`;
}

function renderDrift() {
  const d = S.drift;
  const jours = S.filters.driftDays;
  /* Le PSI compare deux fenêtres consécutives de même durée. Un historique
     irrégulier — c'est le cas d'un parc qui monte en charge — peut donc être
     non mesurable à 7 jours et parfaitement mesurable à 14. La fenêtre doit
     être réglable, sinon l'écran affiche « non mesurable » sans recours. */
  const head = `<div class="chart-head">
      <div class="chart-title">Dérive des modèles IA</div>
      <div style="display:flex;align-items:center;gap:6px">
        ${[[7, '7 j'], [14, '14 j'], [30, '30 j']].map(([n, l]) =>
          `<button class="btn btn-sm" data-driftdays="${n}" title="Fenêtre courante et fenêtre de référence de ${n} jours chacune"
            style="${jours === n ? 'border-color:var(--accent);color:var(--accent);background:rgba(94,170,255,.12)' : ''}">${l}</button>`).join('')}
        <span class="note">/monitor/drift?days=${esc(jours)}</span>
      </div>
    </div>`;

  // L'appel a échoué : dire lequel et pourquoi. Sans cette branche, une erreur
  // laissait le squelette tourner indéfiniment — l'écran semblait charger alors
  // que plus rien n'était en cours.
  if (!d && S.errors.drift) {
    const e = S.errors.drift;
    const introuvable = e.status === 404;
    return `<div class="chart-card">${head}
      <div style="padding:14px 0">
        <div class="badge" style="color:${C.red};background:${tint(C.red)}">appel en échec</div>
        <p class="note" style="margin-top:10px;line-height:1.8">
          GET /monitor/drift → ${esc(e.status || 0)}${e.detail ? ' · ' + esc(String(e.detail).slice(0, 90)) : ''}<br>
          ${introuvable
            ? "L'endpoint n'est pas monté par le serveur en cours d'exécution. Redémarrez uvicorn pour charger <b>monitor_router</b>."
            : e._network
              ? "Serveur injoignable. Les autres sections affichent des données du cache."
              : "Le calcul de dérive n'a pas abouti côté serveur."}<br>
          Ne pas lire cette absence comme « modèles sains » : la dérive n'est pas mesurée.
        </p>
        <button class="btn btn-sm" data-retry style="margin-top:4px">Réessayer</button>
      </div>
    </div>`;
  }

  if (!d) return `<div class="chart-card">${head}<div class="sk" style="height:120px"></div></div>`;

  if (d.available === false) {
    return `<div class="chart-card">${head}
      <p class="note" style="line-height:1.7">Calcul indisponible sur ce déploiement.<br>${esc(d.detail || '')}<br>
      Ne pas lire cette absence comme « modèles sains » : la dérive n'est simplement pas mesurée.</p>
    </div>`;
  }

  // Seuil au-dessous duquel un PSI reste affiché mais n'engage aucune décision.
  const PSI_N_FIABLE = 30;
  const SEV = { ok:['stable',C.teal], warning:['dérive modérée',C.amber],
                alarm:['ré-entraînement requis',C.red], unknown:['indéterminé',C.muted] };

  return `<div class="chart-card">${head}
    <div style="display:flex;flex-direction:column;gap:12px">
      ${(d.models || []).map(mo => {
        const s   = mo.summary || {};
        const sam = mo.samples || {};
        /* Le PSI compare deux distributions : sans échantillon des deux côtés,
           il n'est pas calculable. Afficher « stable » dans ce cas ferait passer
           une absence de mesure pour un verdict de bonne santé. */
        const mesurable = sam.comparable !== false && s.psi != null;
        /* Un PSI calculé sur une poignée d'alertes est arithmétiquement juste et
           statistiquement muet : le découpage en déciles n'a plus de sens. On le
           montre, mais jamais comme un verdict de ré-entraînement. */
        const nMin = Math.min(sam.reference_n ?? 0, sam.current_n ?? 0);
        const faible = mesurable && nMin < PSI_N_FIABLE;
        const [lab, col] = !mesurable ? ['non mesurable', C.muted]
                         : faible     ? ['indicatif', C.amber]
                                      : (SEV[mo.severity] || SEV.unknown);
        return `<div class="card-2">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <div class="mono" style="font-size:12px;color:var(--purple)">${esc(mo.model)}</div>
            ${badge(lab, col)}
          </div>
          <div style="display:flex;gap:16px;margin-top:9px;flex-wrap:wrap">
            ${[['PSI', s.psi != null ? Number(s.psi).toFixed(3) : '—', mesurable ? col : C.muted],
               ['σ', s.score_drift_sigma != null ? s.score_drift_sigma : '—', C.text2],
               ['TAUX FP', s.fp_rate != null ? (s.fp_rate * 100).toFixed(1) + ' %' : '—', C.text2],
               ['ALERTES', s.total_alerts ?? '—', C.text2]].map(([k, v, c]) =>
              `<div><div class="mono" style="font-size:9.5px;color:var(--text-3);letter-spacing:.08em">${k}</div>
                    <div class="mono" style="font-size:13px;color:${c}">${esc(v)}</div></div>`).join('')}
          </div>
          <div style="font-size:12px;color:var(--text-2);margin-top:9px;line-height:1.55">
            ${mesurable
              ? (faible
                  ? `PSI calculé sur ${esc(nMin)} alerte(s) du côté le moins fourni — en dessous de
                     ${esc(PSI_N_FIABLE)}, le découpage en déciles perd son sens.
                     <b style="color:var(--text)">Valeur indicative, pas une décision de ré-entraînement.</b>
                     Élargissez la fenêtre ou attendez d'avoir plus d'historique.`
                  : esc(mo.recommendation || ''))
              : `Deux périodes à comparer sont nécessaires : ${esc(sam.reference_n ?? 0)} alerte(s) sur la fenêtre
                 de référence, ${esc(sam.current_n ?? 0)} sur la fenêtre courante.
                 <b style="color:var(--text)">Absence de mesure, pas absence de dérive.</b>
                 ${jours < 30 ? `Si l'historique de ce modèle est irrégulier, élargissez la fenêtre ci-dessus :
                   les deux périodes ont d'autant plus de chances d'être peuplées.` : ''}`}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${/* Le ré-étalonnage est un travail long qui remplace les .joblib sous un
          service en cours d'exécution. Le déclencher depuis une requête HTTP
          serait imprudent : la console donne la commande, comme pour les
          actions SOAR, et l'opérateur reste maître du moment. */''}
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
      <div class="mono" style="font-size:9.5px;color:var(--text-3);letter-spacing:.08em;margin-bottom:6px">
        RÉ-ÉTALONNER LA LIGNE DE BASE</div>
      <p class="note" style="line-height:1.7;margin-bottom:8px">
        Les modèles ont été entraînés sur des données synthétiques : sur l'activité réelle d'une
        machine, leurs scores bruts saturent et le risque affiché reste bloqué à 100.
        <b>Le ré-étalonnage ne réentraîne pas les modèles</b> — il mesure la distribution réelle
        des scores sur une période calme, puis règle le mapping pour que « 100 » ne s'affiche
        qu'en cas d'écart réel à la normale locale.
      </p>
      <div class="code" style="white-space:pre-wrap">python3 Lot3_IA/recalibrate_baseline.py --collect --duration 2700 --interval 15
python3 Lot3_IA/recalibrate_baseline.py --apply --percentile 99</div>
      <button class="btn btn-sm" style="margin-top:6px"
        data-copycmd="${esc(encodeURIComponent('python3 Lot3_IA/recalibrate_baseline.py --collect --duration 2700 --interval 15\npython3 Lot3_IA/recalibrate_baseline.py --apply --percentile 99'))}">Copier les commandes</button>
      <p class="note" style="margin-top:8px">
        À lancer sur une machine en activité <b>normale</b> : une collecte faite pendant un incident
        apprendrait l'anomalie comme référence. Les modèles sont sauvegardés avant remplacement.
      </p>
    </div>

    <p class="note" style="margin-top:12px">Seuils : PSI &gt; 0,10 surveillance · PSI &gt; 0,25 ré-entraînement.
       Fenêtre courante : les ${esc(d.days || jours)} derniers jours · référence : les ${esc(d.days || jours)} jours
       qui les précèdent. Le PSI mesure l'écart entre ces deux distributions de scores.</p>
  </div>`;
}

const AUDIT_COLS = '120px 1.4fr 1fr 1fr .7fr 1.2fr .9fr';

/* Export CSV du journal d'audit.

   Produit dans le navigateur à partir des lignes AFFICHÉES : ce qui est exporté
   est exactement ce que l'analyste a sous les yeux, filtres compris. Un export
   qui divergerait de l'écran serait une source de litige, or ce journal est
   précisément la pièce qui fait foi en cas de contestation.

   Séparateur point-virgule et BOM UTF-8 : sans eux, Excel en configuration
   française colle tout dans une seule colonne et casse les accents. */
/* Isolement ou reconnexion d'un lot d'agents.

   La confirmation nomme les machines et dit ce que l'action fait RÉELLEMENT :
   elle coupe l'ingestion, elle ne confine pas la machine. Laisser croire à un
   confinement réseau serait la pire des ambiguïtés — on croirait la menace
   contenue alors qu'on a seulement cessé de la regarder. */
/* Vue détail d'un périmètre : son parc, ses alertes, sa file SOAR.

   Tout provient de données DÉJÀ chargées — agents, alertes, propositions — donc
   aucun appel supplémentaire. Le détail n'invente rien : il rassemble au même
   endroit ce qui était éparpillé sur trois sections. */
function detailPerimetre(id) {
  const t = (S.tenants || []).find(x => String(x.id) === String(id));
  if (!t) return;
  const tid = String(t.id);

  const agents  = (S.agents  || []).filter(a => String(a.tenant_id) === tid);
  const alertes = (S.alerts  || []).filter(a => String(a.tenant_id) === tid);
  const soar    = (S.pending || []).filter(p => String(p.tenant_id) === tid);
  const ouvertes = alertes.filter(a => a.statut === 'ouverte');
  const actifs   = agents.filter(a => a.statut === 'actif').length;
  const legacy   = agents.filter(a => a.hmac_scheme && a.hmac_scheme !== 'derived').length;
  const pire     = ouvertes.reduce((m, a) => Math.max(m, Number(a.risque) || 0), 0);

  const bloc = (titre, valeur, couleur, sous) => `
    <div style="flex:1;min-width:120px">
      <div class="mono" style="font-size:9.5px;color:var(--text-3);letter-spacing:.1em">${esc(titre)}</div>
      <div style="font-family:var(--display);font-size:26px;font-weight:600;color:${couleur}">${esc(valeur)}</div>
      <div class="note">${esc(sous)}</div>
    </div>`;

  openModal(esc(t.nom), `
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px">
      ${bloc('Agents', `${actifs}/${agents.length}`, actifs === agents.length ? C.teal : C.amber,
             legacy ? `${legacy} en signature non vérifiée` : 'signatures vérifiées')}
      ${bloc('Alertes ouvertes', ouvertes.length, ouvertes.length ? C.red : C.teal,
             `${alertes.length} au total sur la fenêtre chargée`)}
      ${bloc('Risque maximum', pire || '—', RISK(pire), pire ? 'sur les alertes ouvertes' : 'aucune alerte ouverte')}
      ${bloc('File SOAR', soar.length, soar.length ? C.amber : C.teal, 'en attente de validation')}
    </div>

    <div class="kicker" style="margin-bottom:10px">Parc</div>
    ${agents.length ? `<div style="display:flex;flex-direction:column;gap:3px;margin-bottom:18px">
      ${agents.map(a => `<div style="display:flex;justify-content:space-between;gap:10px;
             font-family:var(--mono);font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text)">${esc(a.hostname)}</span>
        <span style="color:${AGENT_STATE[a.statut] || C.muted}">${esc(AGENT_LABEL[a.statut] || a.statut)}</span>
      </div>`).join('')}
    </div>` : `<p class="note" style="margin-bottom:18px">Aucun agent enrôlé sur ce périmètre.</p>`}

    <div class="kicker" style="margin-bottom:10px">Alertes ouvertes</div>
    ${ouvertes.length ? `<div style="display:flex;flex-direction:column;gap:3px">
      ${ouvertes.slice(0, 12).map(a => `<div style="display:flex;justify-content:space-between;gap:10px;
             font-family:var(--mono);font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--border)">
        <span>${esc(a.entite)} · ${esc(a.type)}</span>
        <span style="color:${RISK(Number(a.risque))}">${esc(a.risque)}</span>
      </div>`).join('')}
      ${ouvertes.length > 12 ? `<p class="note" style="margin-top:6px">+ ${ouvertes.length - 12} autres</p>` : ''}
    </div>` : `<p class="note">Aucune alerte ouverte.</p>`}

    <p class="note" style="margin-top:16px;padding-top:11px;border-top:1px solid var(--border)">
      Type ${esc(t.type)} · criticité ${esc(t.criticite)} · cloisonnement RLS sur tenant_id.
      Ces chiffres portent sur les données déjà chargées par la console, pas sur l'historique complet.
    </p>`,
    `<button class="btn" data-close>Fermer</button>`);
}

async function actionGroupee(isoler) {
  const ids = [...S.selAgents];
  if (!ids.length) return;
  const noms = (S.agents || []).filter(a => ids.includes(String(a.id)))
                               .map(a => a.hostname);

  const ok = await confirmDialog(
    isoler ? `Isoler ${ids.length} agent${ids.length > 1 ? 's' : ''} ?`
           : `Reconnecter ${ids.length} agent${ids.length > 1 ? 's' : ''} ?`,
    (noms.length ? noms.slice(0, 8).join(', ') + (noms.length > 8 ? `, +${noms.length - 8}` : '') + '.\n\n' : '')
    + (isoler
        ? "Leur télémétrie sera refusée à la source : vous cessez de les observer. "
          + "La machine garde son réseau — ce n'est PAS un confinement. Pour couper "
          + "réellement ses flux, il faut une règle sur la passerelle."
        : "Ils redeviendront actifs dès leur prochain lot."),
    isoler ? 'Isoler' : 'Reconnecter');
  if (!ok) return;

  try {
    const r = await NexusAPI.bulkAgentIsolation(ids, isoler);
    toast(`${r.traites} agent${r.traites > 1 ? 's' : ''} ${isoler ? 'isolé' : 'reconnecté'}${r.traites > 1 ? 's' : ''}.`, 'ok');
    S.selAgents = [];
    loadSection();
  } catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
}

function exporterAuditCsv() {
  const rows = window._journalAudit || [];
  if (!rows.length) { toast('Rien à exporter avec ces filtres.', 'err'); return; }

  const cols = [
    ['horodatage', r => r.horodatage],
    ['perimetre',  r => r.tenant_nom],
    ['action',     r => r.action],
    ['cible',      r => r.cible],
    ['cible_type', r => r.cible_type],
    ['impact',     r => r.impact],
    ['decision',   r => r.decision],
    ['statut',     r => r.statut],
    ['execution',  r => r.execution],
    ['acteur',     r => r.acteur],
    ['execute_par', r => r.execute_par],
    ['execute_le',  r => r.execute_le],
    ['entite',     r => r.entite],
    ['detail',     r => r.detail],
  ];
  // Une valeur commençant par = + - @ est interprétée comme formule par les
  // tableurs : on la neutralise. Le détail d'un refus est saisi par un humain.
  const cell = v => {
    let s = v == null ? '' : String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  };
  const csv = '﻿'
    + cols.map(c => c[0]).join(';') + '\r\n'
    + rows.map(r => cols.map(c => cell(c[1](r))).join(';')).join('\r\n');

  const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `nexus-audit-soar-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`${rows.length} ligne${rows.length > 1 ? 's' : ''} exportée${rows.length > 1 ? 's' : ''}.`, 'ok');
}

function renderAuditTable() {
  const a = S.audit;
  // Même règle que la dérive : un appel en échec doit se voir, pas se déguiser
  // en chargement perpétuel.
  if (!a && S.errors.audit) {
    const e = S.errors.audit;
    return `<div class="tbl"><div class="empty err">
      <div class="mark">!</div>
      <h3>Journal d'audit indisponible</h3>
      <p>${e.status === 404
        ? "L'endpoint n'est pas monté par le serveur en cours d'exécution. Redémarrez uvicorn pour charger la route <b>/analyst/soar-audit</b>."
        : "L'API n'a pas répondu. Les actions SOAR continuent d'être journalisées en base : rien n'est perdu."}</p>
      <div class="code">GET /analyst/soar-audit → ${esc(e.status || 0)}${e.detail ? ' · ' + esc(String(e.detail).slice(0, 80)) : ''}</div>
      <button class="btn" style="margin-top:14px" data-retry>Réessayer</button>
    </div></div>`;
  }
  if (!a) return `<div class="tbl"><div class="sk" style="height:200px"></div></div>`;
  /* Recherche plein texte et plage de dates appliquées côté client : le journal
     est déjà chargé (limite 100), un aller-retour serveur n'apporterait rien et
     rendrait la frappe saccadée. Si la limite devait grandir, ces filtres
     devraient passer dans la requête SQL. */
  const fa = S.filters;
  let rows = a.items || [];
  if (fa.auditQ) {
    const q = fa.auditQ.toLowerCase();
    rows = rows.filter(r => [r.action, r.cible, r.acteur, r.detail, r.entite,
                             r.tenant_nom, r.statut, r.decision]
      .some(v => String(v || '').toLowerCase().includes(q)));
  }
  if (fa.auditDu) rows = rows.filter(r => (r.horodatage || '') >= fa.auditDu);
  // Borne haute inclusive : sans le « T23:59 », choisir le 12 exclurait le 12.
  if (fa.auditAu) rows = rows.filter(r => (r.horodatage || '') <= fa.auditAu + 'T23:59:59');
  // Le filtre acteur était appliqué au moment du rendu ; il l'est ici pour que
  // l'export porte exactement les mêmes lignes que le tableau.
  if (fa.auditActeur) rows = rows.filter(r => r.acteur === fa.auditActeur);
  window._journalAudit = rows;

  const facets = a.facets || { impacts:[], acteurs:[] };
  const IMPACT_COL = { fort:C.red, moyen:C.amber, faible:C.text2, info:C.muted };
  /* « EXÉCUTÉE » sans exécution réelle est en teal comme le reste : c'est un
     statut historique, antérieur au suivi d'exécution. La colonne Exécution
     dit la vérité, ligne par ligne. */
  const STATUT_COL = { 'EXÉCUTÉE':C.muted, 'EXÉCUTÉE (manuelle)':C.teal,
                       'APPROUVÉE — EXÉCUTION REQUISE':C.amber,
                       'EN ATTENTE DE VALIDATION':C.amber,
                       'ANNULÉE':C.muted, 'IGNORÉE':C.muted };
  const EXEC_LIB = {
    non_executee: ['non exécutée', C.red],
    manuelle:     ['manuelle',     C.teal],
    automatique:  ['connecteur',   C.teal],
    annulee:      ['annulée',      C.muted],
  };

  return `<div class="tbl">
    <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap">
      <div style="font-size:13px;font-weight:600">Journal d'audit SOAR</div>
      <span class="note">table soar_audit</span>
      <div style="flex:1"></div>
      <select class="select" id="audit-impact">
        <option value="">Tous impacts</option>
        ${facets.impacts.map(i => `<option value="${esc(i)}"${S.filters.auditImpact === i ? ' selected' : ''}>${esc(i)}</option>`).join('')}
      </select>
      <select class="select" id="audit-acteur">
        <option value="">Tous acteurs</option>
        ${facets.acteurs.map(i => `<option value="${esc(i)}"${S.filters.auditActeur === i ? ' selected' : ''}>${esc(i)}</option>`).join('')}
      </select>
      <input class="input" id="audit-q" style="max-width:200px" placeholder="Rechercher…"
             value="${esc(S.filters.auditQ || '')}">
      <input class="input" id="audit-du" type="date" style="max-width:150px"
             value="${esc(S.filters.auditDu || '')}" aria-label="À partir du">
      <input class="input" id="audit-au" type="date" style="max-width:150px"
             value="${esc(S.filters.auditAu || '')}" aria-label="Jusqu'au">
      <button class="btn btn-sm" id="audit-csv"${rows.length ? '' : ' disabled'}>↓ CSV</button>
    </div>
    ${rows.length ? `<div class="tbl-scroll">
      <div class="tbl-head" style="grid-template-columns:${AUDIT_COLS}">
        ${['Horodatage','Action','Cible','Acteur','Impact','Statut','Exécution'].map(h => `<div>${h}</div>`).join('')}
      </div>
      ${rows.map(r => {
        const [el, ec] = EXEC_LIB[r.execution] || ['—', C.muted];
        const attestable = r.decision === 'APPROUVÉE' && r.execution === 'non_executee';
        return `
        <div class="tbl-row" style="grid-template-columns:${AUDIT_COLS}">
          <div class="cell-mono" style="color:var(--text-3)">${esc(fmt(r.horodatage))}</div>
          <div style="font-size:12.5px">${esc(r.action)}</div>
          <div class="cell-mono">${esc(r.cible || r.entite || r.tenant_nom || '—')}</div>
          <div class="cell-mono">${esc(r.acteur || '—')}</div>
          <div>${badge(r.impact || '—', IMPACT_COL[r.impact] || C.muted)}</div>
          <div class="mono" style="font-size:10px;color:${STATUT_COL[r.statut] || C.muted}">${esc(r.statut || '—')}</div>
          <div class="mono" style="font-size:10px;color:${ec}">${esc(el)}${
            r.execute_par ? `<div class="note" style="font-size:9.5px">${esc(r.execute_par)}</div>` : ''}${
            attestable && !S.offline
              ? `<button class="btn btn-sm" style="margin-top:4px;font-size:10px" data-executed="${esc(r.id)}">Attester</button>`
              : ''}</div>
        </div>`; }).join('')}
    </div>`
    : `<div class="empty"><div class="mark" style="color:var(--text-3)">∅</div>
         <h3>Aucune action SOAR enregistrée</h3>
         <p>Le moteur SOAR n'a encore rien journalisé sur les critères choisis. Le journal se remplit dès la première action proposée ou exécutée.</p></div>`}
  </div>`;
}

/* ── File d'alertes et détail ───────────────────────────────────────────── */
function renderAlertes() {
  if (S.loading.alerts && !S.alerts) return `<div class="pane">${skeleton(5, 64)}</div>`;

  /* « agregee » : détection juste mais redondante avec une alerte plus récente
     portant la même condition. Sortie de la file par défaut au même titre qu'une
     alerte résolue — sinon un incident persistant occupe l'écran autant de fois
     qu'il a été détecté.

     Le masquage par défaut ne s'applique QUE sans filtre explicite : sinon
     choisir « agrégée » dans le menu ne renverrait jamais rien. */
  const f = S.filters;
  let list = f.alertStatut
    ? (S.alerts || []).filter(a => a.statut === f.alertStatut)
    : (S.alerts || []).filter(a => a.statut !== 'resolue' && a.statut !== 'agregee');
  if (f.alertRisk) {
    const [lo, hi] = f.alertRisk.split('-').map(Number);
    list = list.filter(a => Number(a.risque) >= lo && (isNaN(hi) || Number(a.risque) <= hi));
  }
  if (f.alertQ) {
    const q = f.alertQ.toLowerCase();
    list = list.filter(a => [a.entite, a.mitre, a.type, a.tenant_nom]
      .some(x => String(x || '').toLowerCase().includes(q)));
  }
  list.sort((a, b) => Number(b.risque) - Number(a.risque));

  if (S.selected && !list.some(a => String(a.id) === S.selected)) S.selected = null;
  if (!S.selected && list.length) S.selected = String(list[0].id);
  const sel = list.find(a => String(a.id) === S.selected);
  // Exposée pour les raccourcis j/k : ils doivent parcourir la liste FILTRÉE
  // telle qu'elle est affichée, pas l'ensemble des alertes chargées.
  window._fileAlertes = list;

  const queue = S.errors.alerts && !S.alerts
    ? `<div class="empty err"><div class="mark">!</div><h3>File indisponible</h3>
         <p>Le socle continue d'ingérer, l'API d'analyse ne répond pas.</p>
         <div class="code">GET /analyst/alerts → ${esc((S.errors.alerts.status) || 0)}</div>
         <button class="btn" style="margin-top:14px" data-retry>Réessayer</button></div>`
    : list.length
    ? list.map(a => {
        const c = RISK(Number(a.risque));
        const tags = mitreList(a.mitre).slice(0, 5).map(tid => {
          const mi = mitreOf(tid);
          return `<span class="q-tag" style="color:${mi.col};background:${mi.col}0F">${esc(mi.tac)}</span>`;
        }).join('');
        return `<button class="q-item" data-select="${esc(a.id)}"
                        style="border-left-color:${c}" aria-selected="${String(a.id) === S.selected}">
          <span class="q-top">
            <span class="q-risk" style="color:${c}">${esc(a.risque)}</span>
            <span style="flex:1;min-width:0">
              <span class="q-title" style="display:block">${esc(a.type)} — ${esc(a.entite)}</span>
              <span class="q-meta" style="display:block">${esc(a.tenant_nom || '—')} · ${esc(a.source_modele || '—')} · ${esc(fmtHour(a.cree_le))}</span>
            </span>
          </span>
          <span class="q-tags">${tags}</span>
        </button>`;
      }).join('')
    : `<div class="empty ok"><div class="mark">✓</div>
         <h3 style="font-size:15px">Aucune alerte ouverte</h3>
         <p style="font-size:12.5px">${(S.alerts || []).length
            ? 'Aucune alerte ne correspond aux filtres actifs.'
            : "Aucune alerte n'est ouverte sur les périmètres supervisés. Les agents remontent leur télémétrie normalement — c'est une bonne nouvelle, pas une absence de données."}</p></div>`;

  return `<div class="split">
    <div class="queue">
      <div class="queue-filters">
        <input class="input" id="alert-q" placeholder="Entité, MITRE, périmètre…" value="${esc(f.alertQ)}">
        <select class="select" id="alert-risk">
          ${[['','Tous risques'],['80-100','≥ 80'],['60-79','60–79'],['40-59','40–59'],['0-39','< 40']].map(([v, l]) =>
            `<option value="${v}"${f.alertRisk === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select>
        <select class="select" id="alert-statut">
          ${[['','Tous statuts'],['ouverte','ouverte'],['en_cours','en cours'],['agregee','agrégée'],['faux_positif','faux positif']].map(([v, l]) =>
            `<option value="${v}"${f.alertStatut === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="queue-list">${queue}</div>
    </div>
    <div class="detail">${sel ? renderDetail(sel) : `
      <div class="empty"><div class="mark" style="color:var(--text-3)">${ic('alerts')}</div>
        <h3>Aucune alerte sélectionnée</h3>
        <p>Choisissez une alerte dans la file pour ouvrir sa chaîne d'attaque, les raisons du modèle et les actions SOAR associées.</p></div>`}
    </div>
  </div>`;
}

/* Décomposition du score.
   N'a de sens que si le score EST une somme de contributions — c'est le cas de
   la corrélation SIEM, qui publie ses termes. Les modèles d'anomalie produisent
   une distance normalisée : on n'invente pas de pondérations pour eux, on s'en
   tient à l'échelle et aux seuils. */
function decomposition(a) {
  const parts = partsList(a.score_parts);
  if (!parts.length) return '';
  const total = parts.reduce((s, p) => s + p.valeur, 0);
  const max = Math.max(1, ...parts.map(p => p.valeur));
  const plafonne = total > Number(a.risque);
  return `
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
      <div class="kicker" style="margin-bottom:12px">Décomposition du score</div>
      ${parts.map(p => `
        <div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--text-2);margin-bottom:4px">
            <span>${esc(p.label)}</span><span class="mono" style="color:var(--text)">+${esc(p.valeur)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(p.valeur / max * 100)}%;background:${RISK(p.valeur * 2)}"></div></div>
        </div>`).join('')}
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:9px;font-family:var(--mono);font-size:12px">
        <span style="color:var(--text-3)">TOTAL${plafonne ? ' (somme ' + total + ', plafonnée)' : ''}</span>
        <span style="color:${RISK(Number(a.risque))};font-weight:700">${esc(a.risque)}</span>
      </div>
      ${plafonne ? `<p class="note" style="margin-top:8px">Le risque est borné à 100 : la somme des contributions le dépasse.</p>` : ''}
    </div>`;
}

function renderDetail(a) {
  const c = RISK(Number(a.risque));
  const reasons = reasonList(a.raisons);
  const tids = mitreList(a.mitre).sort((x, y) => mitreOf(x).phase - mitreOf(y).phase);
  const pending = (S.pending || []).filter(p => String(p.alert_id) === String(a.id));
  const seuil = 70;   // RISK_THRESHOLD par défaut du scoring-service

  /* Chaîne d'attaque. Deux qualités de donnée, jamais confondues :
     — le moteur de corrélation fournit un vrai déroulé horodaté avec la preuve
       de chaque étape ;
     — une alerte de scoring isolé n'a que sa liste de techniques, sans
       chronologie. On l'ordonne par phase ATT&CK en le disant. */
  const etapes = chainList(a.chaine);

  /* Alertes rattachées : même périmètre, même type, même entité, marquées
     « agregee ». Ce n'est pas un regroupement inventé pour l'affichage — c'est
     le lien posé lors de l'arbitrage, quand une condition persistante produit
     une alerte par cycle. Les afficher ici évite d'avoir à les chercher, et
     montre depuis quand la condition dure. */
  const liees = (S.alerts || []).filter(x =>
    String(x.id) !== String(a.id) &&
    x.statut === 'agregee' &&
    x.tenant_id === a.tenant_id &&
    x.type === a.type &&
    x.entite === a.entite);

  const groupe = liees.length ? `
    <div class="card">
      <div class="kicker" style="margin-bottom:12px">Incident regroupé · ${liees.length} détection${liees.length > 1 ? 's' : ''} antérieure${liees.length > 1 ? 's' : ''}</div>
      <p class="note" style="margin-bottom:12px;line-height:1.7">
        La même condition a été détectée ${liees.length + 1} fois sur ${esc(a.entite)}.
        Cette alerte est la plus récente ; les autres lui sont rattachées et sorties de la file.
        <b>Chaque détection était juste</b> — c'est la répétition qui est redondante, pas le signal.
      </p>
      <div style="display:flex;flex-direction:column;gap:4px;max-height:210px;overflow-y:auto">
        ${liees.slice()
            .sort((x, y) => String(y.cree_le).localeCompare(String(x.cree_le)))
            .map(x => `<div style="display:flex;justify-content:space-between;gap:10px;
                                   font-family:var(--mono);font-size:11.5px;padding:4px 0;
                                   border-bottom:1px solid var(--border)">
              <span style="color:var(--text-3)">${esc(fmt(x.cree_le))}</span>
              <span style="color:${RISK(Number(x.risque))}">${esc(x.risque)}</span>
            </div>`).join('')}
      </div>
      <p class="note" style="margin-top:10px">
        Première détection : ${esc(fmt(liees.map(x => x.cree_le).sort()[0]))}
      </p>
    </div>` : '';

  const chain = etapes.length ? `
    <div class="card">
      <div class="kicker" style="margin-bottom:16px">Chaîne d'attaque reconstituée · MITRE ATT&amp;CK</div>
      ${etapes.map((e, i) => {
        const mi = mitreOf(e.technique_id || '');
        const col = mi.col;
        const last = i === etapes.length - 1;
        return `<div class="chain-step" style="grid-template-columns:64px 22px 1fr">
          <div class="mono" style="font-size:10px;color:var(--text-3);text-align:right;padding-top:2px">${esc(e.heure || '')}</div>
          <div class="chain-rail">
            <span class="chain-dot" style="background:${col};box-shadow:0 0 0 3px ${col}26"></span>
            ${last ? '' : `<span class="chain-line" style="background:linear-gradient(180deg,${col},var(--border))"></span>`}
          </div>
          <div class="chain-body">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span class="chain-tac" style="color:${col};background:${col}0F">${esc(e.tactique || mi.tac)}</span>
              ${mitreLien(e.technique_id, e.technique || e.technique_id || '')}
            </div>
            <div class="chain-desc">${esc(mi.lib)}</div>
            ${e.detail ? `<div class="note" style="margin-top:3px;word-break:break-all">${esc(e.detail)}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
      <p class="note" style="border-top:1px solid var(--border);padding-top:11px">
        Déroulé reconstitué par le moteur de corrélation sur une fenêtre glissante :
        heure, tactique et preuve de chaque étape proviennent des événements bruts remontés par l'agent.
      </p>
    </div>`
  : tids.length ? `
    <div class="card">
      <div class="kicker" style="margin-bottom:16px">Techniques observées · MITRE ATT&amp;CK</div>
      ${tids.map((tid, i) => {
        const mi = mitreOf(tid);
        const last = i === tids.length - 1;
        return `<div class="chain-step">
          <div class="chain-rail">
            <span class="chain-dot" style="background:${mi.col};box-shadow:0 0 0 3px ${mi.col}26"></span>
            ${last ? '' : `<span class="chain-line" style="background:linear-gradient(180deg,${mi.col},var(--border))"></span>`}
          </div>
          <div class="chain-body">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span class="chain-tac" style="color:${mi.col};background:${mi.col}0F">${esc(mi.tac)}</span>
              ${mitreLien(tid, tid)}
            </div>
            <div class="chain-desc">${esc(mi.lib)}</div>
          </div>
        </div>`;
      }).join('')}
      <p class="note" style="border-top:1px solid var(--border);padding-top:11px">
        Alerte issue du scoring d'un événement isolé : pas de déroulé horodaté, la liste est
        ordonnée par phase ATT&amp;CK. Seule une corrélation multi-événements produit une chronologie.
      </p>
    </div>` : '';

  /* Raisons du modèle. Quand l'écart σ est disponible, on le trace : c'est
     l'explicabilité chiffrée, pas une phrase de plus. */
  /* Échelle des barres. Un écart-type aberrant (variance quasi nulle sur une
     variable → σ à cinq chiffres) écrase toutes les autres en linéaire : on ne
     verrait plus qu'une barre pleine et trois traits. Au-delà d'un rapport de
     100 entre le plus fort et le plus faible, on passe donc en logarithmique,
     et on le dit sous le bloc — une échelle non annoncée se lit de travers. */
  const sigmas   = reasons.map(r => r.sigma).filter(s => s != null && s > 0);
  const sigmaMax = Math.max(1, ...sigmas);
  const sigmaMin = sigmas.length ? Math.min(...sigmas) : 1;
  const log      = sigmaMax / Math.max(sigmaMin, 1e-6) > 100;
  const largeur  = s => log
    ? Math.round(Math.log1p(s) / Math.log1p(sigmaMax) * 100)
    : Math.round(s / sigmaMax * 100);

  const why = reasons.length ? `
    <div class="card">
      <div class="kicker" style="margin-bottom:12px">Raisons du modèle · <span style="color:var(--purple)">raisons[]</span></div>
      ${reasons.map(r => r.sigma != null ? `
        <div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-2);margin-bottom:4px">
            <span>${esc(r.label)}</span>
            <span class="mono" style="color:var(--purple)">${esc(r.sigma)} σ</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, largeur(r.sigma))}%;background:var(--purple)"></div></div>
        </div>`
        : `<div class="reason">${esc(r.texte || r.label)}</div>`).join('')}
      <p class="note" style="margin-top:12px;border-top:1px solid var(--border);padding-top:11px">
        ${reasons.some(r => r.sigma != null)
          ? `Écart à la ligne de base du modèle, en écarts-type.
             Barres relatives à la déviation la plus forte${log ? ', <b>échelle logarithmique</b> — les écarts couvrent plusieurs ordres de grandeur' : ''}.`
          : "Restituées telles que renvoyées par le modèle, sans reformulation."}
      </p>
    </div>` : '';

  const scale = `
    <div class="card">
      <div class="kicker">Score et seuils</div>
      <div class="scale"><span class="scale-cursor" style="left:calc(${Math.min(100, Math.max(0, Number(a.risque)))}% - 1.5px)"></span></div>
      <div class="scale-ticks"><span>0</span><span>40</span><span>60</span><span>80</span><span>100</span></div>
      <div class="scale-legend">
        <span>score <b style="color:${c}">${esc(a.risque)}</b></span>
        <span>seuil d'alerte ${seuil}</span>
        <span>bande ${Number(a.risque) >= 80 ? 'critique' : Number(a.risque) >= 60 ? 'élevée' : Number(a.risque) >= 40 ? 'moyenne' : 'faible'}</span>
        <span>source ${esc(a.source_modele || '—')}</span>
      </div>
      ${decomposition(a)}
    </div>`;

  const soar = `
    <div class="card" style="border-color:var(--border-2)">
      <div class="kicker" style="margin-bottom:14px">Actions SOAR liées à cette alerte</div>
      ${pending.length ? pending.map(p => soarCard(p)).join('') : `
        <p class="note" style="line-height:1.7">
          Aucune action en attente de validation pour cette alerte.
          Les actions d'impact faible ou moyen s'exécutent sans validation humaine ;
          seul l'impact <b>fort</b> ouvre une demande d'approbation.
        </p>`}
    </div>`;

  return `
    <div class="detail-head">
      <div class="detail-score" style="color:${c}">${esc(a.risque)}<small>/100</small></div>
      <div style="flex:1;min-width:220px">
        <div class="detail-title">${esc(a.type)} — <span class="mono">${esc(a.entite)}</span></div>
        <div class="note" style="margin-top:3px">${esc(String(a.id).slice(0, 8))} · ${esc(fmtFull(a.cree_le))} (UTC+1)</div>
        <div class="detail-pills">
          ${badge(a.statut, a.statut === 'ouverte' ? C.red : a.statut === 'en_cours' ? C.amber : C.muted)}
          ${badge(a.tenant_nom || '—', C.amber)}
          ${badge(a.source_modele || '—', C.purple)}
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" data-fp="${esc(a.id)}"${S.offline ? ' disabled' : ''}>Marquer faux positif</button>
      </div>
    </div>
    ${chain}
    ${groupe ? `<div style="margin-top:14px">${groupe}</div>` : ''}
    <div class="grid-2" style="margin-top:14px">${why}${scale}</div>
    <div style="margin-top:14px">${soar}</div>`;
}

/* Réversibilité : le SOAR distingue les actions annulables des définitives.
   L'interface doit le montrer AVANT la confirmation (designexus.md §8). */
const REVERSIBLE = {
  isolate_host:true, freeze_account:true, block_ip:true, reset_password:false,
  snapshot_memory:false, preserve_logs:false, journal_investigation:false,
  notify_sms:false, notify_whatsapp:false,
};
function reversibility(action) {
  const key = Object.keys(REVERSIBLE).find(k => String(action).toLowerCase().includes(k));
  if (key === undefined) return { label:'réversibilité non déclarée', color:C.muted };
  return REVERSIBLE[key]
    ? { label:'réversible', color:C.teal }
    : { label:'définitive', color:C.amber };
}

const CIBLE_COL = { ip:C.amber, compte:C.purple || C.text2, hote:C.teal, inconnu:C.muted };

function soarCard(p) {
  const IMPACT_COL = { fort:C.red, moyen:C.amber, faible:C.text2, info:C.muted };
  const rev = reversibility(p.action);
  const disabled = S.offline ? ' disabled' : '';

  /* Une action dont la cible ne correspond pas au connecteur compétent ne peut
     pas être exécutée, même à la main. Le signaler avant l'arbitrage évite de
     faire valider un geste impossible. */
  const bloque = !!p.blocage;

  const cible = `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">
      <div><div class="mono" style="font-size:9.5px;color:var(--text-3);letter-spacing:.08em">CIBLE</div>
           <div class="mono" style="font-size:13px;color:var(--text)">${esc(p.cible || '—')}</div></div>
      <div><div class="mono" style="font-size:9.5px;color:var(--text-3);letter-spacing:.08em">TYPE</div>
           <div class="mono" style="font-size:13px;color:${CIBLE_COL[p.cible_type] || C.muted}">${esc(p.cible_type || 'inconnu')}</div></div>
    </div>`;

  const cmd = p.commande
    ? `<div style="margin-top:10px">
         <div class="mono" style="font-size:9.5px;color:var(--text-3);letter-spacing:.08em;margin-bottom:4px">
           COMMANDE À PASSER — AUCUN CONNECTEUR N'EST RACCORDÉ</div>
         <div class="code" style="white-space:pre-wrap;word-break:break-all">${esc(p.commande)}</div>
         <button class="btn btn-sm" style="margin-top:6px"
           data-copycmd="${esc(encodeURIComponent(p.commande))}">Copier la commande</button>
       </div>`
    : bloque
      ? `<div style="margin-top:10px">
           <div class="badge" style="color:${C.red};background:${tint(C.red)}">action inexécutable</div>
           <p class="note" style="margin-top:6px;line-height:1.6">${esc(p.blocage)}</p>
         </div>`
      : '';

  return `<div class="soar-action"${bloque ? ' style="border-color:' + C.red + '55"' : ''}>
    <div class="soar-top">
      <div style="flex:1;min-width:200px">
        <div class="soar-name">${esc(p.action)}</div>
        <div class="soar-ctx">${esc(p.detail || `Proposée le ${fmt(p.horodatage)}.`)}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${badge('impact ' + (p.impact || '—'), IMPACT_COL[p.impact] || C.muted)}
        ${badge(rev.label, rev.color)}
      </div>
    </div>
    ${cible}
    ${cmd}
    <div class="soar-btns">
      <button class="btn btn-sm btn-ok" data-approve="${esc(p.id)}"${disabled}>Approuver</button>
      <button class="btn btn-sm btn-danger" data-reject="${esc(p.id)}"${disabled}>Refuser</button>
      ${p.alert_id ? `<button class="btn btn-sm" data-fp="${esc(p.alert_id)}"${disabled}>Marquer faux positif</button>` : ''}
      <span class="note">${S.offline ? 'Hors ligne — validation impossible tant que l’API ne répond pas.'
        : bloque ? 'Requalifiez ou refusez : cette action n’a pas de cible exploitable.'
        : 'Approuver enregistre la décision. L’exécution reste manuelle.'}</span>
    </div>
  </div>`;
}

/* ── Approbation SOAR (file dédiée) ─────────────────────────────────────── */
function renderSoar() {
  if (S.loading.pending && !S.pending) return `<div class="pane">${skeleton(3, 120)}</div>`;
  if (S.errors.pending && !S.pending) return `<div class="pane">${errorPane('GET /analyst/pending', S.errors.pending)}</div>`;

  const list = S.pending || [];
  return `<div class="pane">
    ${list.length ? `
      <div class="card" style="border-color:var(--border-2)">
        <div class="kicker" style="margin-bottom:14px">${list.length} action${list.length > 1 ? 's' : ''} en attente de validation humaine</div>
        ${list.map(p => soarCard(p)).join('')}
      </div>`
    : `<div class="empty ok"><div class="mark">✓</div>
         <h3>Aucune action en attente</h3>
         <p>Toutes les actions à fort impact ont été arbitrées. Les actions d'impact faible et moyen s'exécutent automatiquement et apparaissent directement au journal.</p></div>`}
    ${renderAuditTable()}
  </div>`;
}

/* ── Enrôlement d'agent ─────────────────────────────────────────────────── */
function renderEnrolement() {
  const e = S.enrol;
  const tenants = S.tenants || [];
  const tname = (tenants.find(t => String(t.id) === e.tenantId) || {}).nom || '—';

  const steps = [
    { n:'1', label:'Périmètre', value: e.tenantId ? `${tname}` : 'à choisir',
      state: e.tenantId ? 'done' : 'active' },
    { n:'2', label:'Jeton', value: e.token ? `${e.token.agent_id.slice(0, 8)} · expire ${fmt(e.token.expires_at)}` : 'non généré',
      state: e.token ? 'done' : e.tenantId ? 'active' : 'idle' },
    { n:'3', label:'Déploiement', value: e.token ? 'choisir la voie selon le réseau du poste' : 'après génération du jeton',
      state: e.token ? 'active' : 'idle' },
  ];

  const tabs = [['oneliner','Commande shell'],['qr','QR code'],['pack','Archive hors ligne'],['csv','Import CSV']];

  return `<div class="pane">
    <div class="wizard">
      ${steps.map(s => `<div class="wiz-step" data-state="${s.state}">
        <div class="wiz-head"><span class="wiz-n">${s.n}</span><span class="wiz-label">${esc(s.label)}</span></div>
        <div class="wiz-value">${esc(s.value)}</div></div>`).join('')}
    </div>

    <div class="card">
      <div class="kicker" style="margin-bottom:14px">1 · Périmètre et poste cible</div>
      <div class="form-row">
        <div class="form-field">
          <label class="form-label" for="en-tenant">Périmètre supervisé</label>
          <select class="select" id="en-tenant">
            <option value="">— choisir —</option>
            ${tenants.map(t => `<option value="${esc(t.id)}"${e.tenantId === String(t.id) ? ' selected' : ''}>${esc(t.nom)} · ${esc(t.criticite)}</option>`).join('')}
          </select>
        </div>
        <div class="form-field">
          <label class="form-label" for="en-host">Nom d'hôte</label>
          <input class="input" id="en-host" placeholder="POSTE-RH-12" value="${esc(e.hostname)}">
        </div>
        <div class="form-field">
          <label class="form-label" for="en-os">Système</label>
          <select class="select" id="en-os">
            <option value="linux"${e.os === 'linux' ? ' selected' : ''}>linux</option>
            <option value="windows"${e.os === 'windows' ? ' selected' : ''}>windows</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label" for="en-hours">Expiration du jeton</label>
          <select class="select" id="en-hours">
            ${[[1,'1 heure'],[24,'24 heures'],[168,'7 jours']].map(([v, l]) =>
              `<option value="${v}"${e.hours === v ? ' selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:14px">
        <label class="checkbox"><input type="checkbox" id="en-once"${e.oneTime ? ' checked' : ''}>
          <span>Usage unique — le jeton est brûlé au premier enrôlement réussi.</span></label>
        <label class="checkbox"><input type="checkbox" id="en-bind"${e.bind ? ' checked' : ''}>
          <span>Lier au nom d'hôte — refuse l'enrôlement depuis une autre machine.</span></label>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary" id="en-generate"${(!e.tenantId || !e.hostname) ? ' disabled' : ''}>Générer le jeton</button>
        <span class="note">POST /provision/token · HMAC-SHA256 · le secret n'est affiché qu'une fois.</span>
      </div>
    </div>

    ${e.token ? `
    <div class="card">
      <div class="kicker" style="margin-bottom:12px">2 · Jeton d'enrôlement généré</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
        <code class="mono" style="font-size:13px;color:var(--teal);background:var(--bg-2);border:1px solid var(--border-2);border-radius:9px;padding:10px 14px;word-break:break-all;max-width:100%">${esc(e.token.bearer_token)}</code>
        <div class="note">agent ${esc(e.token.agent_id.slice(0, 8))} · expire ${esc(fmt(e.token.expires_at))}<br>
          ${e.token.one_time ? 'usage unique' : 'réutilisable'}${e.token.bind_hostname ? ` · lié à ${esc(e.token.bind_hostname)}` : ''}</div>
        <div style="flex:1"></div>
        <button class="btn btn-sm" id="en-copy-token">copier</button>
        <button class="btn btn-sm btn-warn" id="en-rotate">Rotation de clé</button>
        <button class="btn btn-sm btn-danger" id="en-revoke">Révoquer</button>
      </div>
      <p class="note" style="margin-top:12px;border-top:1px solid var(--border);padding-top:11px">
        ⚠ Le jeton et la clé HMAC ne seront plus jamais réaffichés. Déployez maintenant ou régénérez.
      </p>
    </div>` : ''}

    <div>
      <div class="tabs" role="tablist">
        ${tabs.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}"
          aria-selected="${e.tab === k}"${!e.token && k !== 'csv' ? ' disabled title="Générez d’abord un jeton"' : ''}>${esc(l)}</button>`).join('')}
      </div>
      <div class="tabpanel" role="tabpanel">${renderDeployTab()}</div>
    </div>
  </div>`;
}

function renderDeployTab() {
  const e = S.enrol;
  if (e.tab === 'csv') return renderCsvTab();
  if (!e.token) return `<p class="note" style="line-height:1.7">
    Générez d'abord un jeton : les trois voies de déploiement en dépendent.<br>
    Chaque voie correspond à un contexte réseau du poste cible — commande shell si le poste
    atteint le serveur, QR code s'il est isolé du réseau d'administration, archive s'il est coupé d'Internet.</p>`;

  if (e.tab === 'oneliner') {
    const cmd = NexusAPI.getOneliner(e.token.bearer_token, e.hostname, e.os);
    /* Suivi en direct : on interroge le parc, pas le journal d'enrôlement.
       Le journal enregistre les TENTATIVES ; ce qu'on veut savoir, c'est si
       l'agent a réellement commencé à émettre — c'est-à-dire s'il a un premier
       battement. Un jeton consommé sans battement signale une installation qui
       a échoué après l'enrôlement, cas fréquent quand SOC_URL est absent. */
    const vivant = (S.agents || []).find(a => String(a.id) === String(e.token.agent_id));
    const emis   = vivant && vivant.vu_le;
    const suivi = `
      <div class="card" style="border-color:${emis ? C.teal : C.amber}">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="dot" style="background:${emis ? C.teal : C.amber};width:8px;height:8px;border-radius:50%;
                ${emis ? '' : 'animation:pulse 1.6s infinite'}"></span>
          <b style="font-size:13px">${emis ? 'Agent en service' : 'En attente du premier battement'}</b>
          <div style="flex:1"></div>
          <button class="btn btn-sm" id="enrol-refresh">Vérifier maintenant</button>
        </div>
        <p class="note" style="margin-top:8px;line-height:1.7">
          ${emis
            ? `Premier contact établi — dernière émission ${esc(depuis(vivant.vu_il_y_a_s))}. `
              + `Statut : ${esc(AGENT_LABEL[vivant.statut] || vivant.statut)}.`
            : `Le jeton est généré et valide, mais aucun lot n'a encore été reçu. `
              + `Exécutez la commande ci-dessous sur le poste. Si rien n'arrive après, `
              + `la cause la plus fréquente est un <b>SOC_URL absent</b> : le collecteur vise `
              + `alors 127.0.0.1, c'est-à-dire la machine elle-même.`}
        </p>
      </div>`;
    return `<div style="display:flex;flex-direction:column;gap:14px">
      ${suivi}
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <div style="font-size:13.5px;font-weight:600">Commande à exécuter sur le poste cible</div>
          <div style="font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.6">
            Pour un poste qui atteint le serveur NEXUS sur le réseau interne. L'agent s'enrôle et démarre en une commande.</div>
        </div>
        ${badge('réseau interne', C.teal)}
      </div>
      <div class="codeblock">
        <code id="oneliner-code">${esc(cmd)}</code>
        <button class="btn btn-sm copy-btn" data-copy="oneliner-code">copier</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-sm" id="dl-installer">Télécharger le script ${e.os === 'windows' ? '.ps1' : '.sh'}</button>
        <span class="note">GET /provision/oneliner · le script est généré côté serveur depuis les variables d'environnement.</span>
      </div>
    </div>`;
  }

  if (e.tab === 'qr') {
    const qr = e.qr;
    return `<div style="display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start">
      <div class="qr-box">
        ${qr && qr.qr_png_b64
          ? `<img src="data:image/png;base64,${esc(qr.qr_png_b64)}" alt="QR code d'enrôlement pour ${esc(e.hostname)}">`
          : qr
          ? `<div class="note" style="text-align:center;padding:10px">Image indisponible.<br>${esc(qr.message || '')}</div>`
          : `<div class="sk" style="width:100%;height:100%;border-radius:8px"></div>`}
      </div>
      <div style="flex:1;min-width:220px">
        <div style="font-size:13.5px;font-weight:600">Enrôlement par QR code</div>
        <div style="font-size:12.5px;color:var(--text-2);margin-top:5px;line-height:1.65">
          Pour un poste isolé du réseau d'administration ou un terminal mobile. Le code encode la commande
          d'installation complète : l'opérateur la scanne depuis le poste cible, sans ressaisie.</div>
        ${qr && qr.payload_text ? `<div class="codeblock" style="margin-top:14px">
          <code id="qr-payload">${esc(qr.payload_text)}</code>
          <button class="btn btn-sm copy-btn" data-copy="qr-payload">copier</button></div>` : ''}
        <div class="note" style="margin-top:14px">GET /provision/qr/${esc(e.token.agent_id.slice(0, 8))}</div>
        ${renderEnrolLog()}
      </div>
    </div>`;
  }

  if (e.tab === 'pack') {
    return `<div style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <div style="font-size:13.5px;font-weight:600">Archive hors ligne</div>
          <div style="font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.6">
            Pour un segment coupé d'Internet et du serveur : binaire, configuration, jeton et vérification
            d'empreinte dans une seule archive, transportée par clé USB.</div>
        </div>
        ${badge('réseau fermé', C.amber)}
      </div>
      <div class="card-2">
        ${[['nexus-agent (binaire Go)','~5 Mo'],['config.json (périmètre, HMAC, URL d’ingestion)','2 Ko'],
           ['install.sh / Install-NexusAgent.ps1','11 Ko'],['SHA256SUMS + README hors ligne','3 Ko']].map(([n, s]) =>
          `<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--text-2);padding:3px 0">
             <span>${esc(n)}</span><span style="color:var(--text-3)">${esc(s)}</span></div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary" id="dl-pack">Télécharger l'archive</button>
        <span class="note">GET /provision/offline-pack · vérifiez le SHA-256 fourni dans l'archive avant exécution sur le poste.</span>
      </div>
    </div>`;
  }
  return '';
}

function renderEnrolLog() {
  const log = S.enrol.log;
  if (!log) return '';
  return `<div class="note" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);line-height:1.8">
    JOURNAL · GET /provision/status/{id}/log<br>
    ${log.length ? log.slice(0, 5).map(l =>
      `${esc(fmt(l.horodatage))} · ${l.succes ? 'enrôlement réussi' : 'tentative refusée'}${l.ip_source ? ' · ' + esc(l.ip_source) : ''}${l.detail ? ' · ' + esc(String(l.detail).slice(0, 50)) : ''}`
    ).join('<br>') : 'aucune tentative enregistrée · en attente de scan'}
  </div>`;
}

function renderCsvTab() {
  const rows = S.enrol.csvRows;
  const tenants = S.tenants || [];
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <div style="font-size:13.5px;font-weight:600">Enrôlement en masse par CSV</div>
        <div style="font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.6">
          Prévisualisation avant envoi : chaque ligne est validée côté client, aucune ligne n'est transmise
          tant que le parc n'est pas confirmé.</div>
      </div>
      <div class="note" style="text-align:right">en-têtes attendus : hostname,os,description<br>POST /provision/bulk</div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label class="form-label" for="csv-tenant">Périmètre de destination</label>
        <select class="select" id="csv-tenant">
          <option value="">— choisir —</option>
          ${tenants.map(t => `<option value="${esc(t.id)}"${S.enrol.tenantId === String(t.id) ? ' selected' : ''}>${esc(t.nom)}</option>`).join('')}
        </select>
      </div>
    </div>

    <label class="drop" id="csv-drop">
      <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
      ${S.enrol.csv ? `Fichier chargé : <b>${esc(S.enrol.csv.name)}</b> — cliquez pour en choisir un autre.`
                    : 'Déposez un fichier CSV ici, ou cliquez pour le choisir.'}
    </label>

    ${/* Problèmes de structure signalés UNE fois, au-dessus du tableau : une
          colonne absente répétée sur chaque ligne noyait l'information. */''}
    ${(S.enrol.csvErreurs || []).length ? `
      <div class="card" style="border-color:${C.amber}">
        <div class="mono" style="font-size:9.5px;color:var(--amber);letter-spacing:.08em;margin-bottom:8px">CONTRÔLE DU FICHIER</div>
        ${S.enrol.csvErreurs.map(m => `<div style="font-size:12.5px;color:var(--text-2);line-height:1.7">• ${esc(m)}</div>`).join('')}
      </div>` : ''}

    ${rows ? `
      <div class="tbl"><div class="tbl-scroll">
        <div class="tbl-head" style="grid-template-columns:52px 1.4fr 1fr .9fr 1.6fr">
          ${['Ligne','Hôte','Description','OS','Validation'].map(h => `<div>${h}</div>`).join('')}
        </div>
        ${rows.map(r => `<div class="tbl-row" style="grid-template-columns:52px 1.4fr 1fr .9fr 1.6fr;${
              r.ok ? (r.avert ? `background:${tint(C.amber, .06)}` : '') : `background:${tint(C.red, .06)}`}">
          <div class="cell-mono" style="color:var(--text-3)">${esc(r.ligne)}</div>
          <div class="cell-mono" style="color:var(--text)">${esc(r.hostname || '—')}</div>
          <div class="cell-mono">${esc(r.description || '—')}</div>
          <div class="cell-mono">${esc(r.os)}</div>
          <div class="mono" style="font-size:11px;color:${r.ok ? (r.avert ? C.amber : C.teal) : C.red}">${
            r.ok ? (r.avert ? '⚠ ' + esc(r.err) : '✓ prêt') : '✕ ' + esc(r.err)}</div>
        </div>`).join('')}
      </div></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="csv-send"${rows.filter(r => r.ok).length && S.enrol.tenantId ? '' : ' disabled'}>
          Enrôler ${rows.filter(r => r.ok).length} poste${rows.filter(r => r.ok).length > 1 ? 's' : ''} valide${rows.filter(r => r.ok).length > 1 ? 's' : ''}</button>
        ${rows.some(r => !r.ok)
          ? `<span class="note" style="color:var(--amber)">${rows.filter(r => !r.ok).length} ligne(s) rejetée(s) — corrigez le fichier, elles ne seront pas transmises.</span>`
          : `<span class="note">Toutes les lignes sont valides.</span>`}
      </div>` : ''}
  </div>`;
}

/* ═══ Câblage des événements par section ══════════════════════════════════ */
const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
const each = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));

const WIRE = {
  dashboard() {
    each('[data-go-alertes]', 'click', () => goto('alertes'));
    /* Un KPI pose son filtre AVANT de changer de section : sinon la vue
       s'ouvre non filtrée et le chiffre cliqué ne correspond plus à ce qui
       s'affiche. */
    each('[data-kpi]', 'click', e => {
      let c; try { c = JSON.parse(decodeURIComponent(e.currentTarget.dataset.kpi)); }
      catch { return; }
      if (c.statut !== undefined)       S.filters.alertStatut  = c.statut;
      if (c.risk !== undefined)         S.filters.alertRisk    = c.risk;
      if (c.agentStatut !== undefined)  S.filters.agentStatut  = c.agentStatut;
      if (c.statut !== undefined || c.risk !== undefined) S.filters.alertQ = '';
      goto(c.sec);
    });
  },

  perimetres() {
    on('perim-q', 'input', e => { S.filters.perimQ = e.target.value; renderView();
      const i = $('perim-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
    on('perim-crit', 'change', e => { S.filters.perimCrit = e.target.value; renderView(); });
    on('perim-new', 'click', () => tenantForm(null));
    each('[data-perim-detail]', 'click', e => detailPerimetre(e.currentTarget.dataset.perimDetail));
    each('[data-sort-perim]', 'click', e => {
      const k = e.currentTarget.dataset.sortPerim;
      S.sort.perim = { k, dir: S.sort.perim.k === k ? -S.sort.perim.dir : 1 };
      renderView();
    });
    each('[data-perim-edit]', 'click', e =>
      tenantForm((S.tenants || []).find(t => String(t.id) === e.currentTarget.dataset.perimEdit)));
    each('[data-perim-toggle]', 'click', async e => {
      const t = (S.tenants || []).find(x => String(x.id) === e.currentTarget.dataset.perimToggle);
      if (!t) return;
      const suspend = t.statut !== 'suspendu';
      const ok = await confirmDialog(
        suspend ? `Suspendre « ${t.nom} » ?` : `Réactiver « ${t.nom} » ?`,
        suspend ? "L'ingestion de télémétrie est coupée immédiatement. L'historique et les alertes sont conservés : l'action est réversible."
                : "L'ingestion reprend. Les agents du périmètre rattraperont leur file locale.",
        suspend ? 'Suspendre' : 'Réactiver');
      if (!ok) return;
      try {
        await (suspend ? NexusAPI.suspendTenant(t.id) : NexusAPI.activateTenant(t.id));
        toast(suspend ? 'Périmètre suspendu.' : 'Périmètre réactivé.', 'ok');
        loadSection();
      } catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
    });
    each('[data-perim-del]', 'click', async e => {
      const t = (S.tenants || []).find(x => String(x.id) === e.currentTarget.dataset.perimDel);
      if (!t) return;
      const ok = await confirmDialog(`Supprimer « ${t.nom} » ?`,
        "Action définitive et non réversible : agents, alertes et journal d'audit du périmètre sont supprimés en cascade. Préférez la suspension si vous hésitez.",
        'Supprimer définitivement', true);
      if (!ok) return;
      try { await NexusAPI.deleteTenant(t.id); toast('Périmètre supprimé.', 'ok'); loadSection(); }
      catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
    });
  },

  agents() {
    on('agent-q', 'input', e => { S.filters.agentQ = e.target.value; renderView();
      const i = $('agent-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
    on('agent-statut', 'change', e => { S.filters.agentStatut = e.target.value; renderView(); });
    on('agent-os', 'change', e => { S.filters.agentOs = e.target.value; renderView(); });
    each('[data-go-enrol]', 'click', () => goto('enrolement'));

    each('[data-agent-pick]', 'change', e => {
      const id = e.currentTarget.dataset.agentPick;
      S.selAgents = e.currentTarget.checked
        ? [...new Set([...S.selAgents, id])]
        : S.selAgents.filter(x => x !== id);
      renderView();
    });
    on('bulk-vider', 'click', () => { S.selAgents = []; renderView(); });
    on('bulk-isoler',      'click', () => actionGroupee(true));
    on('bulk-reconnecter', 'click', () => actionGroupee(false));

    each('[data-sort-agents]', 'click', e => {
      const k = e.currentTarget.dataset.sortAgents;
      S.sort.agents = { k, dir: S.sort.agents.k === k ? -S.sort.agents.dir : 1 };
      renderView();
    });
    each('[data-agent-rotate]', 'click', async e => {
      const id = e.currentTarget.dataset.agentRotate;
      const ok = await confirmDialog('Rotation de la clé HMAC ?',
        "La clé courante est invalidée immédiatement. L'agent cessera d'être accepté tant que la nouvelle clé ne lui aura pas été configurée. Prévoyez un accès au poste.",
        'Effectuer la rotation');
      if (!ok) return;
      try {
        const r = await NexusAPI.rotateHmac(id);
        secretDialog('Nouvelle clé HMAC', r.hmac_key || r.new_hmac_key || JSON.stringify(r),
          "Configurez-la sur l'agent maintenant : elle ne sera plus jamais réaffichée.");
        loadSection();
      } catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
    });
    each('[data-agent-revoke]', 'click', async e => {
      const id = e.currentTarget.dataset.agentRevoke;
      const ok = await confirmDialog("Révoquer l'agent ?",
        "Le jeton est détruit et l'agent ne pourra plus émettre. Un ré-enrôlement complet sera nécessaire pour le remettre en service. Action non réversible.",
        'Révoquer', true);
      if (!ok) return;
      try { await NexusAPI.revokeToken(id); toast('Agent révoqué.', 'ok'); loadSection(); }
      catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
    });
  },

  sante() {},

  supervision() {
    each('[data-range]', 'click', e => {
      S.filters.metricsHours = Number(e.currentTarget.dataset.range);
      loadSection();
    });
    each('[data-driftdays]', 'click', e => {
      S.filters.driftDays = Number(e.currentTarget.dataset.driftdays);
      S.drift = null; S.errors.drift = null;   // le squelette rend le recalcul visible
      loadSection();
    });
    on('audit-impact', 'change', e => { S.filters.auditImpact = e.target.value; loadSection(); });
    on('audit-acteur', 'change', e => { S.filters.auditActeur = e.target.value; renderView(); });
    on('audit-q', 'input', e => {
      S.filters.auditQ = e.target.value; renderView();
      const i = $('audit-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    });
    on('audit-du', 'change', e => { S.filters.auditDu = e.target.value; renderView(); });
    on('audit-au', 'change', e => { S.filters.auditAu = e.target.value; renderView(); });

function wireSoarButtons() {
  each('[data-approve]', 'click', async ev => {
    const id = ev.currentTarget.dataset.approve;
    const p = (S.pending || []).find(x => String(x.id) === id);
    const rev = reversibility(p && p.action);
    /* Approuver enregistre une DÉCISION. Aucun connecteur pare-feu ou annuaire
       n'est raccordé : la plateforme n'exécute rien. Le dire ici, avant le
       clic, évite de laisser croire que la menace est traitée. */
    const ok = await confirmDialog(`Approuver « ${p ? p.action : id} » ?`,
      `Cible : ${p && p.cible ? p.cible : '—'} (${p && p.cible_type ? p.cible_type : 'type inconnu'}). ` +
      `Impact ${p ? p.impact : '—'} · ${rev.label}.\n\n` +
      (p && p.blocage
        ? `⚠ ${p.blocage}\n\nApprouver ne fera qu'enregistrer votre décision.`
        : "La décision est enregistrée et horodatée. Aucun connecteur n'étant " +
          "raccordé, l'exécution reste manuelle : la commande vous sera affichée."),
      'Approuver');
    if (!ok) return;
    try {
      const r = await NexusAPI.approveAction(id, (NexusAPI.user || {}).email || 'analyste_soc');
      toast(r && r.commande
        ? 'Décision enregistrée. Exécutez la commande affichée, puis attestez-la.'
        : 'Décision enregistrée. Aucune commande exécutable pour cette cible.', 'ok');
      loadSection();
    } catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
  });

  each('[data-executed]', 'click', async ev => {
    const id = ev.currentTarget.dataset.executed;
    const note = await promptDialog('Attester l’exécution',
      'Vous déclarez avoir passé la commande vous-même',
      'Ex. : règle posée sur MikroTik-CENADI à 14 h 20, vérifiée par un ping.');
    if (note === null) return;
    try {
      await NexusAPI.markActionExecuted(id, (NexusAPI.user || {}).email || 'operateur', note);
      toast('Exécution manuelle attestée et horodatée.', 'ok');
      loadSection();
    } catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
  });

  each('[data-copycmd]', 'click', ev => {
    const cmd = decodeURIComponent(ev.currentTarget.dataset.copycmd);
    copy(cmd, 'Commande');
  });

  each('[data-reject]', 'click', async ev => {
    const id = ev.currentTarget.dataset.reject;
    const reason = await promptDialog('Refuser l’action', 'Motif du refus',
      'Ex. : faux positif confirmé auprès du responsable de périmètre.');
    if (reason === null) return;
    try {
      await NexusAPI.rejectAction(id, reason || 'Refusé par analyste');
      toast('Action refusée et journalisée.', 'ok');
      loadSection();
    } catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
  });

  each('[data-fp]', 'click', async ev => {
    const id = ev.currentTarget.dataset.fp;
    const ok = await confirmDialog('Marquer comme faux positif ?',
      "L'alerte sort de la file active et alimente le taux de faux positifs utilisé par le suivi de dérive des modèles.",
      'Marquer faux positif');
    if (!ok) return;
    try { await NexusAPI.markFalsePositive(id); toast('Alerte marquée faux positif.', 'ok'); S.selected = null; loadSection(); }
    catch (err) { toast('Échec : ' + (err.detail || 'API injoignable'), 'err'); }
  });
}

/* Lecture et validation d'un CSV d'enrôlement en masse.

   La validation portait uniquement sur la ligne courante : une colonne absente
   était signalée autant de fois qu'il y avait de lignes, et un hôte déjà
   présent dans le parc passait sans un mot pour échouer à l'envoi. On valide
   maintenant le fichier ET son rapport au parc existant.

   Le séparateur est détecté : un export Excel français produit des
   points-virgules, et découper sur la virgule mettait alors tout dans la
   première colonne sans que rien ne le signale. */
function readCsv(file) {
  S.enrol.csv = file;
  S.enrol.csvErreurs = [];
  const r = new FileReader();
  r.onload = () => {
    let texte = String(r.result).replace(/^﻿/, '');   // BOM des exports Excel
    const lines = texte.split(/\r?\n/).filter(l => l.trim());
    const pb = [];
    if (!lines.length) {
      S.enrol.csvRows = [];
      S.enrol.csvErreurs = ['Fichier vide.'];
      renderView(); return;
    }

    const sep = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',';
    const head = lines[0].split(sep).map(h => h.trim().toLowerCase().replace(/^"|"$/g, ''));
    const iHost = head.indexOf('hostname'), iOs = head.indexOf('os'), iDesc = head.indexOf('description');

    // Problèmes de STRUCTURE : signalés une seule fois, pas à chaque ligne.
    if (iHost < 0) pb.push("Colonne « hostname » absente — en-têtes lus : " + (head.join(', ') || '(aucun)'));
    if (iOs < 0)   pb.push("Colonne « os » absente : « linux » sera appliqué par défaut.");
    if (lines.length === 1) pb.push("Le fichier ne contient qu'une ligne d'en-tête, aucun hôte.");

    const dejaEnParc = new Set((S.agents || []).map(a => String(a.hostname).toLowerCase()));
    const seen = new Set();

    S.enrol.csvRows = lines.slice(1).map((l, i) => {
      const c = l.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
      const hostname = iHost >= 0 ? (c[iHost] || '') : (c[0] || '');
      const os = ((iOs >= 0 ? c[iOs] : '') || 'linux').toLowerCase();
      const description = iDesc >= 0 ? (c[iDesc] || '') : '';
      const cle = hostname.toLowerCase();
      let err = '';
      if (iHost < 0)                     err = 'colonne hostname absente';
      else if (!hostname)                err = 'hôte vide';
      else if (seen.has(cle))            err = 'doublon dans le fichier';
      else if (dejaEnParc.has(cle))      err = 'déjà enrôlé — son jeton sera renouvelé';
      else if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$/.test(hostname))
                                         err = 'nom d’hôte invalide (lettres, chiffres, . _ -)';
      else if (!['linux', 'windows'].includes(os))
                                         err = `OS « ${os} » non pris en charge`;
      if (!seen.has(cle)) seen.add(cle);
      // « Déjà enrôlé » n'est pas une erreur bloquante : le serveur renouvelle
      // le jeton au lieu de créer un doublon. On l'affiche en avertissement.
      const bloquant = err && err !== 'déjà enrôlé — son jeton sera renouvelé';
      return { ligne: i + 2, hostname, os, description, ok: !bloquant, err, avert: !!err && !bloquant };
    });

    const nb = S.enrol.csvRows.filter(x => !x.ok).length;
    if (nb) pb.push(nb > 1
      ? `${nb} lignes rejetées : elles ne seront pas envoyées.`
      : `1 ligne rejetée : elle ne sera pas envoyée.`);
    S.enrol.csvErreurs = pb;
    renderView();
  };
  r.readAsText(file);
}

/* ═══ Modales génériques ══════════════════════════════════════════════════ */
let closeModal = null;

function openModal(title, bodyHTML, footHTML) {
  if (closeModal) closeModal();
  const prev = document.activeElement;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdl-t">
    <div class="modal-head">
      <h2 id="mdl-t">${title}</h2>
      <button class="icon-btn" data-close aria-label="Fermer">${ic('close')}</button>
    </div>
    <div class="modal-body">${bodyHTML}</div>
    ${footHTML ? `<div class="modal-foot">${footHTML}</div>` : ''}
  </div>`;
  document.body.appendChild(ov);

  const focusables = () => [...ov.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);

  function onKey(ev) {
    if (ev.key === 'Escape') { ev.preventDefault(); close(); return; }
    if (ev.key !== 'Tab') return;
    const f = focusables(); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
  function close(result) {
    document.removeEventListener('keydown', onKey);
    ov.remove(); closeModal = null;
    if (prev && prev.focus) prev.focus();
    if (ov._resolve) ov._resolve(result);
  }
  closeModal = close;
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', ev => { if (ev.target === ov) close(undefined); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => close(undefined)));
  setTimeout(() => (focusables()[0] || ov.querySelector('.modal')).focus(), 0);
  return { overlay: ov, close };
}

function confirmDialog(title, body, cta, danger) {
  return new Promise(resolve => {
    const m = openModal(esc(title), `<p style="font-size:13.5px;color:var(--text-2);line-height:1.7">${esc(body)}</p>`,
      `<button class="btn" data-no>Annuler</button>
       <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes
               ${danger ? 'style="border-color:var(--red);color:var(--red)"' : ''}>${esc(cta)}</button>`);
    m.overlay._resolve = v => resolve(v === true);
    m.overlay.querySelector('[data-yes]').addEventListener('click', () => m.close(true));
    m.overlay.querySelector('[data-no]').addEventListener('click', () => m.close(false));
  });
}

function promptDialog(title, label, placeholder) {
  return new Promise(resolve => {
    const m = openModal(esc(title), `
      <div class="form-field">
        <label class="form-label" for="prompt-in">${esc(label)}</label>
        <textarea class="input" id="prompt-in" rows="3" placeholder="${esc(placeholder || '')}"
                  style="font-family:var(--body);font-size:13px;resize:vertical"></textarea>
      </div>`,
      `<button class="btn" data-no>Annuler</button><button class="btn btn-primary" data-yes>Confirmer</button>`);
    m.overlay._resolve = v => resolve(v === undefined ? null : v);
    m.overlay.querySelector('[data-yes]').addEventListener('click', () =>
      m.close(m.overlay.querySelector('#prompt-in').value.trim()));
    m.overlay.querySelector('[data-no]').addEventListener('click', () => m.close(undefined));
  });
}
