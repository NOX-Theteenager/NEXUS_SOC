/* ── Raccourcis clavier de la file d'alertes ──────────────────────────────
   j/k pour naviguer, a pour approuver l'action SOAR proposée, Échap pour
   fermer un dialogue. Seulement dans la section Alertes.

   Deux garde-fous, tous deux indispensables :
   — on ignore la frappe dès qu'un champ a le focus, sinon taper « j » dans la
     recherche déplacerait la sélection ;
   — « a » n'exécute rien directement, il ouvre la confirmation. Un raccourci
     d'une touche qui déclencherait une action de sécurité serait dangereux. */
const _alertesVisibles = () => (S.section === 'alertes');

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  const saisie = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' ||
                       t.tagName === 'SELECT' || t.isContentEditable);
  if (saisie) return;
  if (!_alertesVisibles()) return;

  const list = window._fileAlertes || [];
  if (!list.length) return;
  const i = Math.max(0, list.findIndex(x => String(x.id) === S.selected));

  if (e.key === 'j' || e.key === 'k') {
    e.preventDefault();
    const n = e.key === 'j' ? Math.min(list.length - 1, i + 1) : Math.max(0, i - 1);
    S.selected = String(list[n].id);
    renderView();
    const el = document.querySelector(`[data-select="${CSS.escape(S.selected)}"]`);
    if (el) el.scrollIntoView({ block:'nearest' });
  } else if (e.key === 'a') {
    const p = (S.pending || []).find(x => String(x.alert_id) === S.selected);
    if (!p) { toast("Aucune action SOAR en attente sur cette alerte.", 'err'); return; }
    e.preventDefault();
    const btn = document.querySelector(`[data-approve="${CSS.escape(String(p.id))}"]`);
    if (btn) btn.click();          // passe par la confirmation, jamais en direct
  }
});

/* Bascule de thème. Le re-rendu est indispensable : une bonne partie des
   couleurs est injectée en style inline par le JS, elle ne suit donc pas un
   simple changement d'attribut sur <html>. */
function majIconesTheme() {
  const clair = document.documentElement.getAttribute('data-theme') === 'light';
  $('ic-moon').hidden = clair;
  $('ic-sun').hidden  = !clair;
}
majIconesTheme();
$('theme-toggle').addEventListener('click', () => {
  const clair = document.documentElement.getAttribute('data-theme') === 'light';
  appliquerTheme(clair ? 'dark' : 'light');
  majIconesTheme();
  renderView();
  renderNav();
});
$('burger').addEventListener('click', () => {
  $('side').classList.add('open');
  const sc = document.createElement('div');
  sc.className = 'scrim';
  sc.addEventListener('click', () => { $('side').classList.remove('open'); sc.remove(); });
  document.body.appendChild(sc);
});

window.addEventListener('online',  () => { S.offline = false; loadSection(); });
window.addEventListener('offline', () => { S.offline = true;  renderView(); });
window.addEventListener('hashchange', () => {
  const k = location.hash.slice(1);
  if (k && k !== S.section) goto(k);
});

/* Raccourcis clavier : navigation sans souris sur un poste d'analyste. */
document.addEventListener('keydown', ev => {
  if (ev.target.matches('input,textarea,select') || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const map = { a:'alertes', d:'dashboard', p:'perimetres', g:'agents', s:'sante', m:'supervision', v:'soar', e:'enrolement' };
  if (map[ev.key]) { ev.preventDefault(); goto(map[ev.key]); }
});

/* ═══ Démarrage ═══════════════════════════════════════════════════════════ */
$('view-title').textContent = TITLES[S.section];
renderNav();
loadSection();

/* Scrutation de fond : la file d'alertes et les actions en attente pilotent
   les pastilles de compteur. Une pastille fausse détruit la confiance dans
   l'outil — on rafraîchit les deux ensemble, jamais l'une sans l'autre. */
NexusAPI.poll(async () => {
  try {
    const [alerts, pending] = await Promise.all([
      NexusAPI.getAlerts({ limit:100 }),
      NexusAPI.getPendingSOAR(),
    ]);
    S.alerts = alerts; S.pending = pending;
    S.offline = !navigator.onLine;
    renderNav();
    if (['alertes', 'soar', 'dashboard'].includes(S.section)) renderView();
  } catch (e) {
    if (e && e._network) { S.offline = true; renderView(); }
  }
}, 30_000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
