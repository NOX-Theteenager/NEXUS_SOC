<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0A0F1C"/>
<meta name="description" content="NEXUS SOC — Connexion sécurisée"/>
<title>NEXUS SOC — Connexion</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0A0F1C;
  --bg-2:     #0D1424;
  --surface:  #0F1729;
  --surface-2:#131D33;
  --border:   #1E293B;
  --border-2: #334155;
  --text:     #E2E8F0;
  --text-2:   #94A3B8;
  --text-3:   #64748B;
  --accent:   #5EAAFF;
  --teal:     #3DDC97;
  --amber:    #F5A524;
  --red:      #EF4444;
  --display:  "Fraunces", Georgia, serif;
  --body:     "Manrope", sans-serif;
  --mono:     "JetBrains Mono", monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Fond animé ─────────────────────────────────────────────────────────── */
.bg-grid {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(94,170,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(94,170,255,.018) 1px, transparent 1px);
  background-size: 36px 36px;
}
.bg-glow {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 40%,
    rgba(94,170,255,.07) 0%, transparent 65%);
}
.scan-line {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(94,170,255,.4), transparent);
  animation: scan 6s linear infinite;
  z-index: 0;
}
@keyframes scan { from { top: 0; } to { top: 100vh; } }

/* ── Carte centrale ─────────────────────────────────────────────────────── */
.card {
  position: relative; z-index: 1;
  width: min(420px, calc(100vw - 32px));
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 20px;
  padding: 44px 40px 40px;
  box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(94,170,255,.06);
  animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(.97); }
  to   { opacity: 1; transform: none; }
}

/* ── Logo ───────────────────────────────────────────────────────────────── */
.logo {
  text-align: center;
  margin-bottom: 32px;
}
.logo-mark {
  font-family: var(--display);
  font-style: italic;
  font-weight: 600;
  font-size: 32px;
  letter-spacing: -.03em;
  color: var(--text);
  display: block;
}
.logo-mark em { color: var(--amber); font-style: italic; }
.logo-sub {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--text-3);
  display: block;
  margin-top: 5px;
}
.logo-badge {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px;
  padding: 4px 12px;
  background: rgba(61,220,151,.08);
  border: 1px solid rgba(61,220,151,.2);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--teal);
  letter-spacing: .08em;
}
.logo-badge::before {
  content: "";
  width: 6px; height: 6px;
  background: var(--teal);
  border-radius: 50%;
  animation: pulse 2.2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Formulaire ─────────────────────────────────────────────────────────── */
.form-group { margin-bottom: 18px; }
.form-label {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 7px;
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: 9px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}
.form-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(94,170,255,.15);
}
.form-input.error { border-color: var(--red); }
.form-input::placeholder { color: var(--text-3); }

/* ── Rôle sélecteur (visuel uniquement) ─────────────────────────────────── */
.role-hint {
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--mono);
  margin-top: 5px;
  letter-spacing: .03em;
}

/* ── Bouton de connexion ─────────────────────────────────────────────────── */
.btn-login {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: #07111F;
  border: none;
  border-radius: 10px;
  font-family: var(--body);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  letter-spacing: .01em;
  margin-top: 8px;
  position: relative;
  overflow: hidden;
  transition: opacity .2s, transform .1s;
}
.btn-login:active { transform: scale(.99); }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }
.btn-login .spinner {
  display: none;
  width: 16px; height: 16px;
  border: 2px solid rgba(0,0,0,.3);
  border-top-color: #07111F;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto;
}
.btn-login.loading .spinner { display: block; }
.btn-login.loading .btn-text { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Message d'erreur ───────────────────────────────────────────────────── */
.alert-error {
  display: none;
  padding: 11px 14px;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 9px;
  color: #FCA5A5;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 18px;
}
.alert-error.show { display: block; }

/* ── Séparateur + lien ───────────────────────────────────────────────────── */
.divider {
  text-align: center;
  color: var(--text-3);
  font-size: 12px;
  margin: 22px 0 0;
  font-family: var(--mono);
  letter-spacing: .04em;
}
.divider a {
  color: var(--accent);
  text-decoration: none;
}
.divider a:hover { text-decoration: underline; }

/* ── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 480px) {
  .card { padding: 32px 24px; }
  .logo-mark { font-size: 26px; }
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scan-line"></div>

<div class="card" role="main">

  <div class="logo">
    <span class="logo-mark">NEXUS <em>SOC</em></span>
    <span class="logo-sub">SOCaaS · Cameroun</span>
    <span class="logo-badge">Connexion sécurisée</span>
  </div>

  <div class="alert-error" id="err" role="alert"></div>

  <form id="login-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Adresse e-mail</label>
      <input class="form-input" type="email" id="email"
             placeholder="vous@organisation.cm"
             autocomplete="email" required autofocus/>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Mot de passe</label>
      <input class="form-input" type="password" id="password"
             placeholder="••••••••••••"
             autocomplete="current-password" required/>
    </div>

    <button class="btn-login" id="btn-submit" type="submit">
      <span class="btn-text">Se connecter →</span>
      <span class="spinner"></span>
    </button>
  </form>

  <p class="divider">
    Pas encore de compte ?
    <a href="landing.html">Essai gratuit 30 jours</a>
  </p>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  'use strict';

  // Déjà connecté → rediriger directement
  if (NexusAPI.isAuthenticated) {
    const role = NexusAPI.role;
    redirect(role);
  }

  const form   = document.getElementById('login-form');
  const btn    = document.getElementById('btn-submit');
  const errBox = document.getElementById('err');
  const inEmail = document.getElementById('email');
  const inPwd   = document.getElementById('password');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const email    = inEmail.value.trim();
    const password = inPwd.value;

    if (!email || !password) {
      showError('Veuillez renseigner votre e-mail et votre mot de passe.');
      return;
    }

    setLoading(true);
    try {
      await NexusAPI.login(email, password);
      const role = NexusAPI.role;
      if (!role) {
        showError('Connexion réussie mais rôle utilisateur non reconnu.');
        return;
      }
      redirect(role);
    } catch (err) {
      const msg = err.detail || err.message || 'Identifiants invalides.';
      showError(msg);
      inPwd.value = '';
      inEmail.classList.add('error');
      inPwd.classList.add('error');
    } finally {
      setLoading(false);
    }
  });

  [inEmail, inPwd].forEach(el =>
    el.addEventListener('input', () => {
      clearError();
      el.classList.remove('error');
    })
  );

  function redirect(role) {
    const routes = {
      admin_plateforme: 'console.html',
      analyste_soc:     'console.html',
      dsi_client:       'portail.html',
      lecteur:          'portail.html',
    };
    window.location.href = routes[role] || 'portail.html';
  }

  function setLoading(loading) {
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
  }

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }

  function clearError() {
    errBox.textContent = '';
    errBox.classList.remove('show');
  }
})();
</script>
</body>
</html>
